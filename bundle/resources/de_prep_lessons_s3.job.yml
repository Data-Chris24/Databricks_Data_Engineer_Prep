resources:
  jobs:
    run_lessons_assoc_s3:
      name: "[DE prep] Run ASSOC-S3 lessons"
      description: Executes the S3 worked lessons against the teach tables.
      tasks:
        - task_key: cleaning_and_joins
          notebook_task:
            notebook_path: ../../notebooks/lessons/associate/S3/01_cleaning_and_joins.py
        - task_key: reshaping
          depends_on: [{task_key: cleaning_and_joins}]
          notebook_task:
            notebook_path: ../../notebooks/lessons/associate/S3/02_reshaping_and_aggregates.py
        - task_key: gold_and_quality
          depends_on: [{task_key: reshaping}]
          notebook_task:
            notebook_path: ../../notebooks/lessons/associate/S3/03_gold_and_quality.py
      queue:
        enabled: true
