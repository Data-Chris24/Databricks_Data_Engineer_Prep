# Maintainer-only. These jobs run the reference solution or prove the
# anti-transplant property, so they exist only in the `verify` target:
#     databricks bundle deploy -t verify --profile FREE
#     databricks bundle run <job_key> -t verify --profile FREE
# The learner-facing `free` target never deploys solutions/ at all.
# The ASSOC-S5 assignment job. One definition; the destination comes from bundle
# variables so each target writes somewhere different. This is the shape the
# assignment asks the learner to reproduce.
targets:
  verify:
    resources:
      jobs:
        s5_publish_summary:
          name: '[DE prep] S5 publish channel summary'
          description: Promoted job - the catalog and schema are supplied as parameters from bundle variables,
            never hardcoded in the notebook.
          tasks:
          - task_key: publish
            notebook_task:
              notebook_path: ../../../solutions/ASSOC-S5/solution.py
              base_parameters:
                target_catalog: ${var.catalog}
                target_schema: ${var.schema}
          queue:
            enabled: true
