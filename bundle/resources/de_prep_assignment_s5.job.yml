# The ASSOC-S5 assignment job. One definition; the destination comes from bundle
# variables so each target writes somewhere different. This is the shape the
# assignment asks the learner to reproduce.
resources:
  jobs:
    s5_publish_summary:
      name: "[DE prep] S5 publish channel summary"
      description: >-
        Promoted job - the catalog and schema are supplied as parameters from bundle
        variables, never hardcoded in the notebook.
      tasks:
        - task_key: publish
          notebook_task:
            notebook_path: ../../solutions/ASSOC-S5/solution.py
            base_parameters:
              target_catalog: ${var.catalog}
              target_schema: ${var.schema}
      queue:
        enabled: true
