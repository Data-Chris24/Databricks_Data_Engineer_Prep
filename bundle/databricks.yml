# Declarative Automation Bundle for the DE prep platform.
#
# Resources land in bundle/resources/*.yml as content is built out (Phase 2
# onwards: dataset generators, lesson jobs, per-section grading jobs, the study
# app). Right now the bundle is deliberately near-empty - it exists so the
# deploy pipeline is real and testable before there is anything riding on it.
#
#   databricks bundle validate --strict -t free --profile FREE
#   databricks bundle deploy -t free --profile FREE

bundle:
  name: databricks-de-prep

include:
  - resources/*.yml

# The bundle lives in bundle/ but its notebooks live in notebooks/, above it.
# By default a bundle can only sync files under its own root, so widen the sync
# root to the repository. Without this, any notebook_task path fails validation
# with "is not contained in sync root path".
sync:
  paths:
    - ..
  # No exclude list: bundle sync already honours .gitignore, which covers .venv,
  # __pycache__ and the rest. Adding patterns for paths that do not exist yet
  # fails `validate --strict`, which treats an unmatched pattern as a warning.

variables:
  catalog:
    description: Unity Catalog catalog that lab and assignment data is written to.
    default: workspace
  schema:
    description: Schema within the catalog for lab and assignment tables.
    default: de_prep
  # The study app's Lakebase branch and database, as full resource names. These
  # are IDs we chose, not workspace identifiers, so they are safe as defaults.
  lakebase_branch:
    description: Lakebase branch the study app stores learner progress in.
    default: projects/de-prep/branches/production
  lakebase_database:
    description: Lakebase database within that branch.
    default: projects/de-prep/branches/production/databases/databricks-postgres

targets:
  # Free Edition - the required path. Serverless only; never add job clusters
  # here, they do not exist on this tier.
  free:
    default: true
    mode: development

  # A second environment on the same workspace, standing in for staging. It changes
  # only the `schema` variable - the job definition is identical, which is the whole
  # point of promoting rather than duplicating.
  staging:
    mode: development
    variables:
      schema: de_prep_staging

  # Premium/trial workspace for the optional classic-compute labs.
  # See docs/optional-classic-track.md - this target bills real infrastructure.
  classic:
    mode: development
