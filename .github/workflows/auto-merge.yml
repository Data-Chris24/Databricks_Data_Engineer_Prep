name: Enable auto-merge

# Turns on GitHub's native auto-merge for a PR. GitHub then merges it by itself
# once the branch ruleset is satisfied - required approvals in, required checks
# green. Doing it this way rather than merging from a workflow means the ruleset
# stays the single source of truth for "is this allowed to merge".
on:
  pull_request:
    types: [opened, ready_for_review, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    # Drafts are not ready, and Dependabot-style bot PRs should be opted in
    # deliberately rather than by default.
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Turn on auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            try {
              await github.graphql(`
                mutation($id: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $id,
                    mergeMethod: SQUASH
                  }) { clientMutationId }
                }
              `, { id: pr.node_id });
              core.info(`Auto-merge enabled for #${pr.number}.`);
            } catch (e) {
              // Most common cause: "Allow auto-merge" is off in repo settings,
              // or no ruleset requires anything so the PR is already mergeable.
              core.warning(
                `Could not enable auto-merge: ${e.message}\n` +
                `See docs/ci-cd.md - Settings > General > "Allow auto-merge" must be on.`
              );
            }
