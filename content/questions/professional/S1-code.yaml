# PRO-S1 — Developing Code for Data Processing (22%, the heaviest Professional section)
# Original questions written for this repository. Scenario-shaped: "what happens
# when", "which choice and why". At least three per objective; Q001-Q003 (official samples)
# live in official-samples.yaml.
meta:
  source: Original, written for this repository.
  note: Covers PRO-S1-O1 through O11.

questions:
  # ---------------------------------------------------------------- O1 project structure
  - id: PRO-S1-Q004
    objective_ids: [PRO-S1-O1]
    difficulty: application
    provenance: original
    tags: [dabs, project-structure, targets, variables]
    stem: >-
      A team keeps two nearly identical job definitions in their bundle, prod_etl.yml
      and staging_etl.yml, differing only in the target schema and the schedule. A
      reviewer says the layout is wrong. Which change matches how a Declarative
      Automation Bundle is meant to be organised?
    options:
      A: One job definition; the schema and schedule become variables that the staging and prod targets override.
      B: Keep both files but move them under a shared/ folder so the duplication is at least visible.
      C: Merge them into one file with two job keys, prod_etl and staging_etl, so a single deploy creates both.
      D: Replace the YAML with a Python script that generates the right file for whichever environment is selected.
    correct: A
    explanation: >-
      A bundle expresses environment differences as targets overriding variables, not
      as copies of a resource. One definition deployed with -t staging or -t prod is
      the whole point: the resource is reviewed once and cannot drift between
      environments.
    distractor_rationale:
      B: Moving the copies does not remove the duplication; the two definitions can still drift.
      C: Two job keys in one file still deploys both jobs to every target, including the one that should not have them.
      D: Generating YAML from a script hides the configuration from review and from bundle validate.
    near_misses:
      - text: >-
          One job definition; the schema and schedule switch automatically with each target's
          mode, development or production.
        why: >-
          mode sets behaviour, not your values. In bundle validate, development mode added the
          "[dev <user>]" prefix and paused the schedule; the schema came only from the
          variable the target overrode.
      - text: >-
          Keep both files; each target lists its own file under include and overrides the
          schema and schedule variables.
        why: >-
          include is a top-level setting only. Under a target, bundle validate warns "unknown
          field: include" and ignores it, so neither job is deployed.
      - text: >-
          Keep both files; each target lists its own file under include, and its mode picks
          the schema and schedule.
        why: >-
          A target cannot include files (bundle validate: "unknown field: include"), and mode
          never chooses schema or schedule values; variables overridden per target do.

  - id: PRO-S1-Q005
    objective_ids: [PRO-S1-O1]
    difficulty: analysis
    provenance: original
    tags: [dabs, development-mode, prefix, collaboration]
    stem: >-
      Two engineers deploy the same bundle to the same workspace from their laptops
      using a target with mode: development. Later the platform team deploys it from
      CI as a service principal. What does the workspace contain afterwards?
    options:
      A: Three copies of every resource, each prefixed with its deployer, and a paused schedule on each.
      B: One copy of every resource, owned by whoever deployed last.
      C: Two copies, because the service principal's deploy overwrites the first engineer's.
      D: A deploy error, because a bundle can only be deployed to a workspace once.
    correct: A
    explanation: >-
      Development mode prefixes resource names with the deployer's identity and
      pauses schedules, so each deployer gets an isolated copy. Three deployers,
      three copies. This is why development mode is safe for people and why
      production deployments use a single principal and production mode.
    distractor_rationale:
      B: Resources are namespaced by deployer in development mode; they do not overwrite each other.
      C: The service principal is a third deployer with its own prefix, not a replacement for anyone.
      D: A bundle can be deployed many times to one workspace; the prefix is what keeps them apart.
    near_misses:
      - text: >-
          Three copies of every resource, each prefixed with its deployer, with every schedule
          left active.
        why: >-
          Development mode pauses schedules and triggers on every deployed job; bundle
          validate rendered the schedule with pause_status PAUSED.
      - text: >-
          One copy of every resource, prefixed with the target name, and a paused schedule on
          it.
        why: >-
          The prefix is the deploying identity, "[dev <short_name>]", not the target name, and
          each deployer keeps separate state, so three deployers create three copies.
      - text: >-
          One copy of every resource, prefixed with the target name, with its schedule left
          active.
        why: >-
          Each deployer gets its own "[dev <short_name>]" copy, and development mode pauses
          every schedule.

  - id: PRO-S1-Q025
    objective_ids: [PRO-S1-O1]
    difficulty: application
    provenance: original
    tags: [dabs, project-structure, include, relative-paths]
    stem: >-
      A bundle keeps its notebook at src/etl.py and its job in resources/etl.job.yml,
      which databricks.yml pulls in with include: resources/*.yml. The task says
      notebook_path: ./src/etl.py, and bundle validate fails with "notebook
      resources/src/etl.py not found". What is the cause and the fix?
    options:
      A: A relative path resolves from the folder of the file that contains it, so write ../src/etl.py.
      B: The notebook is not part of the bundle until it is included; add src/*.py to the include list.
      C: Bundles cannot reference notebooks by relative path; write the notebook's full /Workspace/Users/... path.
      D: Notebook paths must leave out the file extension; write ./src/etl.
    correct: A
    explanation: >-
      Every relative path in a bundle is resolved against the directory of the YAML file
      it is written in, not the bundle root. A job defined in resources/ therefore reaches
      the notebook with ../src/etl.py, which bundle validate resolves to the synced copy
      under the bundle's files folder. Keeping one resource per file under resources/ is
      still the right layout; it just means paths are written from there.
    distractor_rationale:
      B: >-
        include takes configuration files only. Adding src/*.py fails validate with "Files in
        the 'include' configuration section must be YAML or JSON files"; the notebook is
        already synced because it sits inside the bundle folder.
      C: >-
        A hard-coded workspace path ties the bundle to one user and one deployment location,
        which is what bundles exist to avoid; the relative path is supported, written from
        the right folder.
      D: >-
        The extension is not the problem. ./src/etl still failed: notebook
        "resources/src/etl" not found.
    near_misses:
      - text: >-
          A relative path resolves from the folder bundle validate is run in, so write
          ../src/etl.py.
        why: >-
          The working directory plays no part: run from inside resources/, ./src/etl.py failed
          with the same "resources/src/etl.py not found", and ../src/etl.py validated from
          either folder. It is the YAML file's folder that counts.
      - text: >-
          A relative path resolves from the folder of the file that contains it, so write
          src/etl.py without the leading ./.
        why: >-
          Without ./ the path is still relative to resources/: validate failed with "notebook
          resources/src/etl.py not found". The path has to step up with ../.
      - text: >-
          A relative path resolves from the folder bundle validate is run in, so write
          src/etl.py without the leading ./.
        why: >-
          Neither the working directory nor the ./ matters. src/etl.py failed as
          resources/src/etl.py, because paths resolve from the YAML file's folder.

  # ---------------------------------------------------------------- O2 dependencies
  - id: PRO-S1-Q006
    objective_ids: [PRO-S1-O2]
    difficulty: application
    provenance: original
    tags: [pip, restart-python, dependencies, notebooks]
    stem: >-
      A notebook runs %pip install somepkg==2.1.0 in its first cell, then imports the
      package in the next cell and finds version 1.8.0 already loaded. What is the
      correct fix?
    options:
      A: Restart the Python process after the install, with %restart_python or dbutils.library.restartPython(), before importing.
      B: Use %sh pip install instead, which installs into the correct environment.
      C: Move the import above the install so the old version is never loaded.
      D: Install the package as a cluster library; %pip cannot change a version that is already installed.
    correct: A
    explanation: >-
      %pip changes the notebook session's environment, but a module already imported
      into the running Python process stays loaded until the process restarts. The
      restart is the documented step between installing and importing a different
      version.
    distractor_rationale:
      B: "%sh pip installs into the driver's shell environment, not necessarily the notebook's Python, and still would not unload the imported module."
      C: Importing first loads the old version, which is exactly the problem.
      D: "%pip can install a different version; the process just has to restart for the import to see it."
    near_misses:
      - text: >-
          Restart the Spark session after the install, with spark.stop() and a new session,
          before importing.
        why: >-
          The stale module lives in the Python process, not the Spark session. Restarting the
          session left the old version imported; only restarting Python loaded the new one.
      - text: >-
          Restart the Python process after the install, but only on classic compute;
          serverless notebooks reload the package on import.
        why: >-
          Serverless behaves the same: after %pip install the import still returned the old
          version until dbutils.library.restartPython() ran.
      - text: >-
          Restart the Spark session after the install, and only on classic compute; serverless
          notebooks reload the package on import.
        why: >-
          On serverless the import kept the old version after %pip, and a Spark session
          restart does not unload a Python module; restarting Python does.

  - id: PRO-S1-Q007
    objective_ids: [PRO-S1-O2]
    difficulty: analysis
    provenance: original
    tags: [wheel, volumes, task-libraries, serverless-environment]
    stem: >-
      A job task must use an internal Python library that is not on PyPI. The team
      has a built wheel file. Which approach installs it for the task in a way that is
      reproducible across runs and workspaces?
    options:
      A: Upload the wheel to a Unity Catalog volume and declare it as a task library (or in the serverless environment) referencing that path.
      B: Copy the wheel into the notebook's folder and add a %pip install ./lib.whl cell at the top of the notebook.
      C: Unzip the wheel and append its folder to sys.path in the first cell.
      D: Push the wheel to a public PyPI mirror so a plain %pip install works everywhere.
    correct: A
    explanation: >-
      Task libraries and serverless environments install declared dependencies before
      the task starts, and a volume is governed storage that every workspace deploying
      the bundle can reference. The installation is part of the job's definition, not
      of the notebook's runtime behaviour.
    distractor_rationale:
      B: It works once, but the install is buried in the notebook, runs on every execution, and relative paths break when the notebook moves.
      C: Manipulating sys.path skips dependency resolution entirely and fails as soon as the library has its own dependencies.
      D: Publishing internal code to a public index is a security problem, not a packaging solution.
    near_misses:
      - text: >-
          Upload the wheel to dbfs:/FileStore and declare it as a task library (or in the
          serverless environment) referencing that path.
        why: >-
          Libraries stored in the DBFS root are deprecated and disabled by default from
          Databricks Runtime 15.1, and serverless does not read them. A Unity Catalog volume
          is the governed location.
      - text: >-
          Upload the wheel to a Unity Catalog volume and %pip install it from that path in the
          notebook's first cell.
        why: >-
          The volume is right, but the install is buried in the notebook and repeated every
          run instead of being part of the job definition that installs before the task
          starts.
      - text: >-
          Upload the wheel to dbfs:/FileStore and %pip install it from that path in the
          notebook's first cell.
        why: >-
          DBFS-root storage for libraries is deprecated, and a %pip cell keeps the install out
          of the job definition. Use a volume path declared as a task dependency.

  - id: PRO-S1-Q026
    objective_ids: [PRO-S1-O2]
    difficulty: analysis
    provenance: original
    tags: [pip, dependency-conflict, wheels, troubleshooting]
    stem: >-
      A notebook's first cell is %pip install of two internal wheels from a volume,
      ingest_lib and report_lib, on one line. ingest_lib requires six>=1.16 and
      report_lib requires six<1.16. What happens, and what is the right fix?
    options:
      A: pip refuses with ResolutionImpossible and installs neither; make the pins agree, for example a report_lib release that accepts six 1.16.
      B: Both install, each with its own copy of six, because notebook-scoped libraries are isolated per package.
      C: The wheel listed last wins; six is downgraded and ingest_lib keeps working with a warning.
      D: pip installs ingest_lib and silently skips report_lib; reorder the line to choose which one is kept.
    correct: A
    explanation: >-
      pip resolves the whole request before installing anything. Two requirements that no
      single version of six can satisfy are a conflict, so it stops with
      ResolutionImpossible ("The conflict is caused by: ingest-lib 1.0 depends on
      six>=1.16, report-lib 1.0 depends on six<1.16") and the environment is left
      unchanged; on serverless the %pip cell fails with PipError. One Python environment holds one version of each package; the fix is to
      make the requirements compatible, not to find an install order that hides the
      clash.
    distractor_rationale:
      B: >-
        A Python environment has one six. Notebook scoping separates notebooks from each
        other, not packages within one notebook.
      C: >-
        On one line nothing is installed at all; order only matters when the wheels are
        installed in separate commands, and then the earlier library is left broken.
      D: >-
        Nothing is skipped silently: the command fails, reports both requirements, and
        installs neither wheel.
    near_misses:
      - text: >-
          pip refuses with ResolutionImpossible and installs neither; install the two wheels
          in separate %pip cells so each one resolves on its own.
        why: >-
          The second install succeeds and downgrades six: on serverless the notebook then had
          six 1.15.0 under ingest_lib 1.0, and pip (run locally) printed only "ingest-lib
          1.0 requires six>=1.16, but you have six 1.15.0 which is incompatible". The clash
          is hidden, not fixed.
      - text: >-
          pip installs ingest_lib, then stops at report_lib with ResolutionImpossible; make
          the pins agree, for example a report_lib release that accepts six 1.16.
        why: >-
          Resolution happens before any install. After the failed command neither wheel, nor
          six, was installed.
      - text: >-
          pip installs ingest_lib, then stops at report_lib with ResolutionImpossible;
          install report_lib in a separate %pip cell so it resolves on its own.
        why: >-
          Nothing is installed by the failing command, and installing report_lib on its own
          downgrades six under ingest_lib with only a warning.

  # ---------------------------------------------------------------- O3 UDFs
  - id: PRO-S1-Q008
    objective_ids: [PRO-S1-O3]
    difficulty: analysis
    provenance: original
    tags: [pandas-udf, python-udf, performance, arrow]
    stem: >-
      A pipeline applies a Python function to 400 million rows using a scalar
      @udf and takes hours. The logic is pure arithmetic on two numeric columns.
      Which change delivers the largest improvement, and why?
    options:
      A: Rewrite the logic with built-in column expressions; it stays in the JVM and the optimiser can see through it.
      B: Convert the @udf to a pandas UDF; Arrow batches amortise serialisation, which is where most of the time goes.
      C: Increase spark.sql.shuffle.partitions so more executors share the UDF work.
      D: Cache the input DataFrame so the UDF is not recomputed for each downstream action.
    correct: A
    explanation: >-
      Pure arithmetic needs no UDF at all. Built-in expressions run inside the JVM
      with no per-row serialisation and remain visible to the optimiser, which beats
      even a vectorised UDF. A pandas UDF is the right answer only when a UDF is
      genuinely required.
    distractor_rationale:
      B: A pandas UDF is far faster than a scalar UDF, but it still ships data to Python; for arithmetic a built-in removes the cost entirely.
      C: A UDF's cost is per row, not per partition; more partitions do not change how many rows cross the Python boundary.
      D: Caching avoids recomputation across actions but does nothing about the per-row cost within one computation.
    near_misses:
      - text: >-
          Set useArrow=True on the @udf; it then stays in the JVM and the optimiser can see
          through it.
        why: >-
          An Arrow-optimised Python UDF still runs in a Python worker: its plan shows an
          ArrowEvalPython step, and the optimiser cannot look inside the function.
      - text: >-
          Rewrite the logic with built-in column expressions; Spark then ships the columns to
          Python in Arrow batches, amortising serialisation.
        why: >-
          Built-in expressions never leave the JVM: their plan has no Python evaluation step
          at all, which is why they beat every UDF.
      - text: >-
          Set useArrow=True on the @udf; Arrow batches amortise serialisation, which is where
          most of the time goes.
        why: >-
          Arrow makes the transfer cheaper, but every row still goes to Python and back. For
          plain arithmetic a built-in expression removes the transfer entirely.

  - id: PRO-S1-Q009
    objective_ids: [PRO-S1-O3]
    difficulty: application
    provenance: original
    tags: [pandas-udf, series, batch]
    stem: >-
      Which statement about a pandas UDF declared with pandas_udf(returnType=DoubleType())
      that takes one pandas.Series and returns one is accurate?
    options:
      A: Spark hands it a batch of values at a time as a Series, transferred via Arrow, so the function must return a Series of the same length.
      B: Spark calls it once per row with a one-element Series, so it behaves like a scalar UDF with extra overhead.
      C: The function receives the entire column as a single Series, so it must fit in the driver's memory.
      D: It runs inside the JVM once the Series is converted, so it is as fast as a built-in.
    correct: A
    explanation: >-
      A scalar pandas UDF is vectorised over batches (spark.sql.execution.arrow.maxRecordsPerBatch
      controls the size). Each call receives a Series for the batch and must return a
      Series of the same length, which is what makes it much cheaper than a row-at-a-time UDF.
    distractor_rationale:
      B: That describes a scalar Python UDF; the pandas UDF's benefit is precisely the batching.
      C: Batches are bounded and processed on executors, not the whole column on the driver.
      D: The function is Python running in a Python worker; Arrow makes the transfer cheap but it is not JVM code.
    near_misses:
      - text: >-
          Spark hands it a batch of values at a time as a Series, transferred via Arrow, and
          it may return a shorter Series, which Spark pads with nulls.
        why: >-
          Nothing is padded. Returning one value fewer than it received failed the query with
          a PythonException.
      - text: >-
          Spark hands it the whole partition at once as a single Series, transferred via
          Arrow, so the function must return a Series of the same length.
        why: >-
          A partition is split into Arrow batches: a single 25,000-row partition reached the
          function as eight Series of 3,125 rows each.
      - text: >-
          Spark hands it the whole partition at once as a single Series, transferred via
          Arrow, and it may return a shorter Series, which Spark pads with nulls.
        why: >-
          Calls are per Arrow batch (a 25,000-row partition arrived as eight batches), and a
          shorter result fails the query rather than being padded.

  - id: PRO-S1-Q027
    objective_ids: [PRO-S1-O3]
    difficulty: application
    provenance: original
    tags: [pandas-udf, iterator, type-hints, code]
    stem: >-
      Loading the scoring model takes several seconds, so it must happen once per
      partition rather than once per Arrow batch. Which parameter completes the pandas
      UDF?
    code_language: python
    option_style: code
    code: |-
      from typing import Iterator, Iterable
      import pandas as pd
      from pyspark.sql.functions import pandas_udf

      @pandas_udf("double")
      def score(________) -> Iterator[pd.Series]:
          model = load_model()              # expensive set-up
          for s in batches:
              yield pd.Series(model.predict(s))
    options:
      A: |-
        batches: Iterator[pd.Series]
      B: |-
        batches: pd.Series
      C: |-
        batches
      D: |-
        *batches: pd.Series
    correct: A
    explanation: >-
      The type hints choose the kind of pandas UDF. Iterator[pd.Series] in and out makes it
      an iterator UDF: Spark calls the function once per partition and feeds it that
      partition's batches, so code before the loop runs once. In a run over two
      partitions, set-up in this form ran twice; the same set-up in a Series-to-Series UDF
      ran 26 times, once per batch. Use the iterator form whenever there is expensive state
      to build before the data arrives.
    distractor_rationale:
      B: >-
        A Series in with an Iterator out is not a valid combination: UNSUPPORTED_SIGNATURE,
        "Unsupported signature: (batches: pandas.core.series.Series) ->
        Iterator[pandas.core.series.Series]".
      C: >-
        Every parameter needs a type hint for Spark to infer the UDF type:
        TYPE_HINT_SHOULD_BE_SPECIFIED.
      D: >-
        Variable arguments do not form an iterator: UNSUPPORTED_SIGNATURE when the UDF is
        defined.
    near_misses:
      - text: |-
          batches: Iterable[pd.Series]
        why: >-
          Spark recognises Iterator, not Iterable: UNSUPPORTED_SIGNATURE, "(batches:
          Iterable[pandas.core.series.Series]) -> Iterator[pandas.core.series.Series]".
      - text: |-
          batch: Iterator[pd.Series]
        why: >-
          The UDF is accepted, but the body loops over batches, which no longer exists: the
          query failed in the Python worker with NameError: name 'batches' is not defined.
      - text: |-
          batch: Iterable[pd.Series]
        why: >-
          Iterable is not a supported hint, so the UDF is rejected at definition with
          UNSUPPORTED_SIGNATURE before the misnamed parameter even matters.

  # ---------------------------------------------------------------- O4 pipelines + Auto Loader
  - id: PRO-S1-Q010
    objective_ids: [PRO-S1-O4]
    difficulty: application
    provenance: original
    tags: [auto-loader, cloudfiles, checkpoint, exactly-once]
    stem: >-
      A landing folder receives new JSON files every few minutes. A declarative
      pipeline reads it with Auto Loader into a streaming table. A file that was
      already processed is accidentally re-uploaded with the same name and content.
      What happens on the next update?
    options:
      A: Auto Loader ignores it, because its checkpoint records the file as already consumed.
      B: The rows are appended again, because Auto Loader processes whatever is present in the folder.
      C: The pipeline fails with a duplicate-file error that must be cleared manually.
      D: The streaming table is rebuilt from scratch to reconcile the folder with the table.
    correct: A
    explanation: >-
      Auto Loader tracks discovered files in its checkpoint and processes each file
      exactly once. An identical re-upload is not new to it. This is what makes a
      streaming table over a landing zone safe to re-run.
    distractor_rationale:
      B: That is what a plain batch read of the folder would do; Auto Loader's file tracking exists to prevent it.
      C: Nothing raises; the file is simply not re-processed.
      D: Streaming tables process incrementally; a full rebuild is what a materialized view does.
    near_misses:
      - text: >-
          Auto Loader ignores it, because it compares each file's content with the files it
          has already loaded.
        why: >-
          Tracking is by file path, not content. The same content uploaded under a new name
          was loaded again and doubled the rows.
      - text: >-
          The rows are appended again, because the checkpoint records each file's modification
          time and the re-upload gave it a new one.
        why: >-
          With the default cloudFiles.allowOverwrites=false a known path is not re-read even
          when its modification time changes; the row count stayed the same.
      - text: >-
          The rows are appended again, because Auto Loader compares each file's content with
          the files already loaded, and an upload counts as new content.
        why: >-
          Auto Loader neither compares content nor reloads the known path: the re-upload added
          no rows, while identical content under a new name did.

  - id: PRO-S1-Q011
    objective_ids: [PRO-S1-O4]
    difficulty: analysis
    provenance: original
    tags: [declarative-pipelines, expectations, dependency-graph]
    stem: >-
      A declarative pipeline defines bronze, silver and gold tables. The silver
      definition reads bronze; gold reads silver. An engineer asks where the task
      ordering is configured. What is the accurate answer?
    options:
      A: Nowhere; the pipeline derives the execution order from the table definitions' references to each other.
      B: In the pipeline settings, where each table lists its upstream tables under depends_on.
      C: In a job that wraps the pipeline, with one task per table and explicit dependencies.
      D: By file order; tables are materialised in the order their definitions appear.
    correct: A
    explanation: >-
      Declarative pipelines build the dependency graph from what each table reads.
      You describe the tables; the platform derives the order, parallelism and
      retries. That is the difference in abstraction level from a job of tasks.
    distractor_rationale:
      B: depends_on is a job-task concept; pipeline tables do not declare dependencies by hand.
      C: A job can trigger the pipeline as one task, but the ordering inside the pipeline is still derived.
      D: File and definition order do not matter; references do.
    near_misses:
      - text: >-
          Nowhere; the pipeline orders tables by the medallion prefix in their names, bronze,
          then silver, then gold.
        why: >-
          Names carry no meaning. Tables named a_gold, m_silver and z_bronze, defined in that
          order, still ran bronze first because of what each one reads.
      - text: >-
          In each table's definition, which must list the tables its query reads in a
          depends_on argument.
        why: >-
          Table definitions have no depends_on argument; the references in the query are what
          build the graph.
      - text: >-
          In each table's definition, which must state its medallion layer in a depends_on
          argument so bronze runs before silver and gold.
        why: >-
          There is no such argument and layers mean nothing to the pipeline; it reads the
          dependency graph from each query's references.

  - id: PRO-S1-Q028
    objective_ids: [PRO-S1-O4]
    difficulty: application
    provenance: original
    tags: [auto-loader, schema-evolution, rescued-data, code]
    stem: >-
      Upstream teams add JSON fields without warning. The bronze stream must keep
      running when a new field appears, must not change the table's schema, and must
      keep the new field's values so they can be inspected later. Which line completes
      the reader?
    code_language: python
    option_style: code
    code: |-
      (spark.readStream
          .format("cloudFiles")
          .option("cloudFiles.format", "json")
          .option("cloudFiles.schemaLocation", "/Volumes/main/raw/_schemas/events")
          ________
          .load("/Volumes/main/raw/events")
        .writeStream
          .option("checkpointLocation", "/Volumes/main/raw/_checkpoints/events")
          .trigger(availableNow=True)
          .toTable("main.bronze.events"))
    options:
      A: |-
        .option("cloudFiles.schemaEvolutionMode", "rescue")
      B: |-
        .option("cloudFiles.schemaEvolutionMode", "none")
      C: |-
        .option("cloudFiles.schemaEvolutionMode", "addNewColumns")
      D: |-
        .option("cloudFiles.schemaEvolutionMode", "failOnNewColumns")
    correct: A
    explanation: >-
      rescue never evolves the schema: a field Auto Loader does not know goes into the
      _rescued_data column, as JSON together with the source file's path, and the stream
      carries on. In a run, a file adding "coupon" loaded with _rescued_data
      {"coupon":"X","_file_path":...} and the table kept its columns. The modes differ
      exactly on the three requirements: whether the stream stops, whether the schema
      grows, and whether the new values are kept.
    distractor_rationale:
      B: >-
        none keeps the stream running and the schema unchanged, but the new field is simply
        dropped: the table had only id and amt, with no _rescued_data column to inspect.
      C: >-
        addNewColumns stops the stream with UNKNOWN_FIELD_EXCEPTION.NEW_FIELDS_IN_RECORD_WITH_FILE_PATH
        so the restart can widen the schema, and the restart then failed at the Delta sink
        with DELTA_METADATA_MISMATCH. It changes the schema, which the stem forbids.
      D: >-
        failOnNewColumns stops the stream and keeps failing ("can be fixed by an automatic
        retry: false") until someone changes the schema.
    near_misses:
      - text: |-
          .option("schemaEvolutionMode", "rescue")
        why: >-
          Without the cloudFiles. prefix the key is not Auto Loader's and is ignored, so the
          default addNewColumns applies: the stream stopped with
          UNKNOWN_FIELD_EXCEPTION.NEW_FIELDS_IN_RECORD_WITH_FILE_PATH.
      - text: |-
          .option("cloudFiles.schemaEvolutionMode", "rescued")
        why: >-
          The mode is rescue; the stream would not start: CF_INVALID_SCHEMA_EVOLUTION_MODE,
          "cloudFiles.schemaEvolutionMode must be one of" addNewColumnsWithTypeWidening,
          addNewColumns, failOnNewColumns, rescue, none.
      - text: |-
          .option("schemaEvolutionMode", "rescued")
        why: >-
          The unprefixed key is ignored, so the invalid value is never checked; the default
          addNewColumns applied and the stream stopped on the new field.

  # ---------------------------------------------------------------- O5 jobs via UI/API/CLI
  - id: PRO-S1-Q029
    objective_ids: [PRO-S1-O5]
    difficulty: application
    provenance: original
    tags: [jobs-api, cli, reset, update]
    stem: >-
      A script moves a job's nightly schedule from 02:00 to 03:00 with databricks jobs
      reset, sending the job_id and a new_settings object that contains only the new
      schedule. The next morning the job is called "Untitled" and has no tasks. What
      happened, and what should the script have done?
    options:
      A: reset replaces the job's entire settings with new_settings; jobs update with the same new_settings changes only the schedule.
      B: The schedule change takes effect only after the job is reset to its last saved version, which had no tasks; deploy the job again.
      C: The CLI ignores job_id inside the JSON body and created a new job; pass the job ID as a positional argument.
      D: reset is correct but must be followed by jobs run-now, which restores the tasks from the last run.
    correct: A
    explanation: >-
      The Jobs API has two ways to change a job. reset overwrites every setting with
      new_settings, so anything not in it, such as name, tasks, environments and tags,
      reverts to empty or default. update merges: the top-level fields in new_settings
      replace or extend the existing ones, the rest are untouched, and fields_to_remove
      deletes fields explicitly. For a one-field change, update is the call; reset is for
      replacing a definition wholesale, which is what a bundle deploy does for you.
    distractor_rationale:
      B: Nothing is restored from a saved version; the job keeps its ID and gets exactly the settings that were sent.
      C: >-
        With --json the CLI expects job_id in the body (a positional ID alongside --json is
        refused), and the same job ID came back with the new, near-empty settings.
      D: A run executes the current settings; it does not bring back tasks that the reset removed.
    near_misses:
      - text: >-
          reset deletes the job and re-creates it under a new job ID from new_settings; jobs
          update with the same new_settings changes only the schedule.
        why: >-
          The job ID did not change: getting the same ID after the reset returned name
          "Untitled", no tasks, no tags and the new schedule.
      - text: >-
          reset replaces the job's entire settings with new_settings; jobs update is right for
          the schedule, but tasks or tags sent to update replace the existing list or map.
        why: >-
          update merges these too: sending one new task kept the existing task beside it, and
          sending tags {owner} kept the existing team tag.
      - text: >-
          reset deletes the job and re-creates it under a new job ID; jobs update is right for
          the schedule, but tasks or tags sent to update replace the existing list or map.
        why: >-
          The job ID survives a reset, and update merged both a new task and a new tag into
          what was already there.

  # ---------------------------------------------------------------- O6 streaming tables vs MVs
  - id: PRO-S1-Q012
    objective_ids: [PRO-S1-O6]
    difficulty: analysis
    provenance: original
    tags: [streaming-table, materialized-view, updates, choice]
    stem: >-
      A source table receives new rows continuously, but a nightly correction job
      also updates a few percent of yesterday's rows. A downstream aggregate must
      reflect those corrections. Which object should hold the aggregate, and why?
    options:
      A: A materialized view, because it recomputes over the current source and so reflects updated rows.
      B: A streaming table, because it processes the source incrementally and is cheaper.
      C: A streaming table with skipChangeCommits, so the updates do not break the stream.
      D: Either; both objects reflect updates to source rows on the next refresh.
    correct: A
    explanation: >-
      A streaming table processes each source row once and does not revisit rows it
      already consumed, so a correction to an old row never reaches it. When old data
      changes, a materialized view is the object that stays correct.
    distractor_rationale:
      B: >-
        Cheaper, but wrong here: the corrected rows were already consumed and will not be re-read.
      C: skipChangeCommits keeps the stream running by skipping the update commits, which is exactly the data you need.
      D: The two differ precisely on this point; a streaming table does not reflect updates to consumed rows.
    near_misses:
      - text: >-
          A materialized view, because it processes only the rows appended since its last
          refresh, and so reflects updated rows.
        why: >-
          That describes a streaming table. A materialized view's result always matches its
          query over the current source, which is why it picks up corrected rows.
      - text: >-
          A streaming table, because it recomputes over the current source and so reflects
          updated rows.
        why: >-
          A streaming table never recomputes. After an UPDATE to its source the next streaming
          read failed with DELTA_SOURCE_TABLE_IGNORE_CHANGES.
      - text: >-
          A streaming table, because it processes only the rows appended since its last
          refresh, and so reflects updated rows.
        why: >-
          An update commit is not an append: the stream stopped with
          DELTA_SOURCE_TABLE_IGNORE_CHANGES, and with skipChangeCommits the corrections were
          silently skipped.

  - id: PRO-S1-Q013
    objective_ids: [PRO-S1-O6]
    difficulty: application
    provenance: original
    tags: [streaming-table, append-only, cost]
    stem: >-
      An events table only ever receives appends and has grown to billions of rows.
      A pipeline keeps a per-day count from it. The count is currently a materialized
      view that recomputes on every hourly refresh. What is the best change?
    options:
      A: Make it a streaming table; an append-only source lets it process only new rows each refresh.
      B: Keep the materialized view but refresh it daily instead of hourly.
      C: Replace it with a plain table rebuilt by a scheduled job.
      D: Add a partition on day to the source so the materialized view refresh reads less.
    correct: A
    explanation: >-
      When the source is append-only, a streaming table's cost is proportional to new
      data rather than to the whole query. Refreshing hourly then reads an hour of
      events instead of billions of rows.
    distractor_rationale:
      B: Reduces frequency, not the cost of each recompute, and lowers freshness.
      C: A scheduled rebuild is the same full recompute without the pipeline's bookkeeping.
      D: Layout helps a full scan somewhat, but the recompute is still over the whole history every refresh.
    near_misses:
      - text: >-
          Make it a streaming table; it processes only new rows each refresh, and still copes
          if old events are later updated.
        why: >-
          Only an append-only source suits it. An UPDATE to the source stopped the stream with
          DELTA_SOURCE_TABLE_IGNORE_CHANGES.
      - text: >-
          Keep the materialized view but read the source with STREAM(), so each refresh
          processes only new rows.
        why: >-
          The pipeline rejected it: the source "was read as a stream ... but is not a
          streaming table. Either add the STREAMING keyword". Reading only new rows is what a
          streaming table does.
      - text: >-
          Keep the materialized view but read the source with STREAM(); it then copes even if
          old events are later updated.
        why: >-
          A materialized view cannot take a streaming read (the pipeline says to add the
          STREAMING keyword), and a stream over a source that receives updates fails with
          DELTA_SOURCE_TABLE_IGNORE_CHANGES.

  # ---------------------------------------------------------------- O7 AUTO CDC
  - id: PRO-S1-Q014
    objective_ids: [PRO-S1-O7]
    difficulty: analysis
    provenance: original
    tags: [auto-cdc, apply-changes, sequence-by, out-of-order]
    stem: >-
      A change feed delivers two events for customer C7 out of order: first an update
      with seq_num 12 setting tier to gold, then an older update with seq_num 9 setting
      tier to silver. The target uses AUTO CDC with SEQUENCE BY seq_num. What is C7's
      tier in the target after both are applied?
    options:
      A: gold, because the event with the higher sequence wins regardless of arrival order.
      B: silver, because the most recently applied event overwrites the previous one.
      C: Both rows are kept, because the events have different sequence numbers.
      D: The update fails, because sequence numbers must arrive in increasing order.
    correct: A
    explanation: >-
      SEQUENCE BY defines which event is newest. A late-arriving event with a lower
      sequence is recognised as older and ignored. This is the first of the three
      things AUTO CDC handles that a hand-written upsert usually gets wrong.
    distractor_rationale:
      B: Arrival order carries no meaning under SEQUENCE BY; that is the point of specifying it.
      C: AUTO CDC maintains one current row per key; it is not an append of events.
      D: Out-of-order arrival is expected and handled, not an error.
    near_misses:
      - text: >-
          gold, because AUTO CDC keeps the first event to arrive for each key and ignores
          later arrivals.
        why: >-
          Arrival order means nothing. When seq_num 9 arrived first and seq_num 12 in a later
          update, the later arrival won and the row became gold.
      - text: >-
          silver, because SEQUENCE BY orders events only within one update, and the seq_num 9
          event arrived in a later update.
        why: >-
          Sequencing holds across updates. With seq_num 12 applied first, the seq_num 9 event
          in the next update was recognised as older and ignored; the row stayed gold.
      - text: >-
          silver, because AUTO CDC keeps the event that arrived first only when both arrive in
          the same update.
        why: >-
          Neither update boundaries nor arrival order matter; the higher seq_num wins whether
          the events arrive together or in separate updates.

  - id: PRO-S1-Q015
    objective_ids: [PRO-S1-O7]
    difficulty: application
    provenance: original
    tags: [auto-cdc, apply-as-delete, tombstone]
    stem: >-
      A CDC pipeline uses APPLY CHANGES INTO ... KEYS (id) SEQUENCE BY ts but omits
      the APPLY AS DELETE WHEN clause. The feed contains rows with op = 'delete'.
      What does the target contain for a key whose latest event is a delete?
    options:
      A: A row for the key, populated from the delete event's columns, because without the clause a delete is treated like any other upsert.
      B: No row, because rows with op = 'delete' are recognised by name.
      C: The row from the event before the delete, because deletes are ignored.
      D: An error at pipeline update time, because deletes require the clause.
    correct: A
    explanation: >-
      AUTO CDC only knows an event is a delete if you tell it which condition means
      delete. Without APPLY AS DELETE WHEN, the delete event is just the latest event
      for the key and is applied as an update, leaving a row that says "deleted"
      instead of removing it.
    distractor_rationale:
      B: The column name op has no special meaning; the clause supplies the condition.
      C: The delete event has the highest sequence, so it wins; it is applied as an upsert, not ignored.
      D: Nothing fails; the result is silently wrong, which is worse.
    near_misses:
      - text: >-
          No row, because AUTO CDC treats an event whose other columns are all null as a
          delete.
        why: >-
          Nothing infers a delete from nulls. Without the clause the event was applied as an
          update: the row stayed, with tier null and op 'delete'.
      - text: >-
          A row for the key, holding the values from the event before the delete, because
          events whose columns are all null are skipped.
        why: >-
          Null values are written as nulls (unless IGNORE NULL UPDATES is set). The row held
          tier null and op 'delete', not the earlier values.
      - text: >-
          No row, because events whose columns are all null are skipped and a key whose latest
          event was skipped is removed.
        why: >-
          Nothing is skipped or removed. The delete event was applied as an upsert and the row
          stayed, with tier null and op 'delete'.

  # ---------------------------------------------------------------- O8 SS vs DLT
  - id: PRO-S1-Q016
    objective_ids: [PRO-S1-O8]
    difficulty: analysis
    provenance: original
    tags: [structured-streaming, declarative-pipelines, choice, foreachbatch]
    stem: >-
      A team must write each micro-batch to an external system with a custom
      idempotent upsert, control the trigger precisely, and manage watermarks for a
      stream-stream join. Which approach fits, and why?
    options:
      A: >-
        Structured Streaming; the requirements are about controlling the mechanics
        (foreachBatch, triggers, watermarks) that a declarative pipeline mostly manages
        for you.
      B: A declarative pipeline; it manages checkpoints and triggers for you, so the custom sink becomes an expectation.
      C: A declarative pipeline with a materialized view over the external system.
      D: Either, since both support arbitrary sinks through the same API.
    correct: A
    explanation: >-
      Declarative pipelines are a different abstraction: you describe tables and the
      platform runs them, deciding when updates run and owning the checkpoints. Pipelines
      can now join streams with watermarks and offer a foreachBatch sink (Public Preview,
      Python only), but when the requirement is control over the mechanics, such as a
      custom per-batch write, an exact trigger and the join's state, Structured Streaming
      is the tool.
    distractor_rationale:
      B: Expectations are data-quality rules, not sinks. Pipelines do have a foreachBatch sink (Public Preview), but not as an expectation, and the trigger stays the platform's.
      C: Materialized views compute tables in the lakehouse; they do not write to external systems.
      D: They are not interchangeable; the pipeline deliberately hides what this team needs to control.
    near_misses:
      - text: >-
          Structured Streaming; declarative pipelines cannot join two streams, and this design
          needs a stream-stream join with watermarks.
        why: >-
          Pipelines do support stream-stream joins, with a watermark on both sides. What they
          abstract away is control over triggers, checkpoints and per-batch writes.
      - text: >-
          A declarative pipeline; its foreachBatch sink covers the custom upsert, and the
          pipeline runs the triggers and checkpoints for you.
        why: >-
          A foreachBatch sink does exist (Public Preview, Python only), but the pipeline
          decides when updates run and owns the checkpoints, which is the control this team
          needs.
      - text: >-
          A declarative pipeline; it cannot join two streams, but its foreachBatch sink can
          perform the join and the custom upsert on each batch.
        why: >-
          Pipelines can join two streams when both sides have a watermark; the join is not the
          reason to choose either tool. Control over triggers is.

  - id: PRO-S1-Q030
    objective_ids: [PRO-S1-O8]
    difficulty: analysis
    provenance: original
    tags: [structured-streaming, declarative-pipelines, state, full-refresh]
    stem: >-
      A running total of sales by region must now be grouped by store. Team one runs it
      as a Structured Streaming job writing in complete mode to a Delta table; team two
      runs it as a streaming table in a declarative pipeline. Each team changes only the
      GROUP BY and runs again as usual, with the same checkpoint and a normal update.
      What happens?
    options:
      A: >-
        The Structured Streaming run fails, because its checkpoint and target are shaped by
        region; the pipeline update succeeds but reuses the old state, so region totals sit
        in the store column until a full refresh.
      B: >-
        Both recompute the totals by store, because each reprocesses its source whenever the
        query's text changes.
      C: >-
        Both fail, and each needs its checkpoint deleted by hand before the new grouping can
        run.
      D: >-
        The Structured Streaming run starts again from the beginning of the source, because a
        changed query invalidates the checkpoint; the pipeline refuses to update a streaming
        table whose query changed.
    correct: A
    explanation: >-
      Both tools keep aggregation state in a checkpoint; the difference is who owns it. In
      Structured Streaming you do: the restarted query was refused, with
      STATE_STORE_KEY_SCHEMA_NOT_COMPATIBLE from the region-keyed state or
      DELTA_METADATA_MISMATCH from the region-shaped table, and the fix is yours to make: a
      new checkpoint location and a replaced target. In a pipeline the platform owns the
      checkpoint, and an incompatible change is not always caught: a normal update
      completed and produced store rows "eu" and "us" carried over from the old state. A
      full refresh, which clears the table's data, checkpoints and state and reprocesses
      the source, gave the correct s1 to s4 totals. Changing a stateful query means
      resetting state in either tool; only the mechanism differs.
    distractor_rationale:
      B: >-
        Neither reprocesses on its own. A checkpoint records how far the source was read, and
        both runs carried on from it.
      C: >-
        Only the Structured Streaming run failed. The pipeline update completed, with wrong
        rows, and a pipeline's checkpoint is reset by a full refresh, not by hand.
      D: >-
        A changed query does not rewind a checkpoint: the Structured Streaming run failed
        instead. The pipeline accepted the changed query and ran a normal update.
    near_misses:
      - text: >-
          The Structured Streaming run fails, because its checkpoint and target are shaped by
          region; the pipeline update fails too, asking for a full refresh before the new
          grouping can run.
        why: >-
          The pipeline update completed without an error, and the table held store values "eu"
          and "us" with the old region totals. Nothing prompts the full refresh; you have to
          know to run it.
      - text: >-
          The Structured Streaming run recomputes by store, because complete mode rewrites the
          whole table; the pipeline update succeeds but reuses the old state, so region totals
          sit in the store column until a full refresh.
        why: >-
          Complete mode rewrites the output from the state, not from the source. The restarted
          query failed against the region-keyed state (STATE_STORE_KEY_SCHEMA_NOT_COMPATIBLE)
          or the region-shaped table (DELTA_METADATA_MISMATCH).
      - text: >-
          The Structured Streaming run recomputes by store, because complete mode rewrites the
          whole table; the pipeline update fails, asking for a full refresh before the new
          grouping can run.
        why: >-
          It is the other way round: the Structured Streaming run failed loudly, and the
          pipeline update completed silently with the old region totals under store.

  # ---------------------------------------------------------------- O9 control flow
  - id: PRO-S1-Q017
    objective_ids: [PRO-S1-O9]
    difficulty: application
    provenance: original
    tags: [jobs, for-each, if-else, task-values]
    stem: >-
      A job must process a list of regions produced by its first task, running the
      same notebook once per region with at most three in parallel, and then run a
      summary task only if every region succeeded. Which job structure achieves this?
    options:
      A: The first task sets a task value with the regions; a For each task iterates over it with concurrency 3 running the notebook; the summary depends on it with run_if ALL_SUCCESS.
      B: One notebook task that loops over regions in Python, followed by the summary task.
      C: A separate task per region hard-coded in the job, followed by the summary task.
      D: An If/else task that checks each region in turn and runs the notebook for the ones that match.
    correct: A
    explanation: >-
      For each is the job-level loop: it takes a list (from a task value or a
      parameter), runs a nested task per element with a concurrency limit, and
      downstream tasks can depend on the whole loop with a run_if condition. The
      regions can then change at runtime without editing the job.
    distractor_rationale:
      B: A Python loop is sequential inside one task and gives no per-region run history, retries or concurrency.
      C: Hard-coding tasks fixes the region list in the job definition and cannot follow the first task's output.
      D: If/else branches on a condition; it does not iterate.
    near_misses:
      - text: >-
          The first task sets a task value with the regions; a For each task iterates over it
          running the notebook, with the job's max_concurrent_runs set to 3; the summary
          depends on it with run_if ALL_SUCCESS.
        why: >-
          max_concurrent_runs limits whole runs of the job, not iterations. The parallelism of
          a loop is the For each task's own concurrency setting.
      - text: >-
          The first task sets a task value with the regions; a For each task iterates over it
          with concurrency 3 running the notebook; the summary depends on it with run_if
          ALL_DONE.
        why: >-
          ALL_DONE runs the dependant once the loop finishes in any state. With one region
          failing, the For each task failed, and in the same run an ALL_DONE task after a
          failed task still ran.
      - text: >-
          The first task sets a task value with the regions; a For each task iterates over it
          running the notebook, with the job's max_concurrent_runs set to 3; the summary
          depends on it with run_if ALL_DONE.
        why: >-
          max_concurrent_runs governs whole job runs, not loop iterations, and ALL_DONE runs
          the summary even when a region has failed.

  - id: PRO-S1-Q018
    objective_ids: [PRO-S1-O9]
    difficulty: analysis
    provenance: original
    tags: [jobs, run-if, cleanup, failure]
    stem: >-
      A job has a load task and a cleanup task that removes temporary files. The
      cleanup must run whether the load succeeds or fails. How should the dependency
      be configured?
    options:
      A: cleanup depends on load with run_if set to ALL_DONE.
      B: cleanup depends on load with the default condition; failed upstream tasks still trigger dependants.
      C: Put the cleanup at the start of the job so it runs before anything can fail.
      D: Give the load task a retry so it never fails, making the default dependency sufficient.
    correct: A
    explanation: >-
      run_if controls when a dependant runs relative to its upstream tasks' outcomes.
      ALL_DONE runs the cleanup once the load has finished in any state, which is the
      pattern for tidy-up work. The default (ALL_SUCCESS) would skip it on failure.
    distractor_rationale:
      B: The default condition is ALL_SUCCESS; a failed upstream task skips the dependant.
      C: Cleaning up before the load leaves the files behind when the load fails, which is the case that matters.
      D: Retries reduce failures; they do not eliminate them, and a retry that gives up still skips the dependant.
    near_misses:
      - text: >-
          cleanup depends on load with run_if set to NONE_FAILED.
        why: >-
          NONE_FAILED requires that no upstream task failed. With load failing, the cleanup
          was skipped as upstream failed.
      - text: >-
          load depends on cleanup with run_if set to ALL_DONE.
        why: >-
          The dependency points the wrong way: cleanup runs first and finishes before load
          creates any files, so whatever load leaves behind stays.
      - text: >-
          load depends on cleanup with run_if set to NONE_FAILED.
        why: >-
          Cleanup would run before load ever writes a file, and NONE_FAILED would not help
          anyway: it skips a dependant whenever an upstream task fails.

  - id: PRO-S1-Q031
    objective_ids: [PRO-S1-O9]
    difficulty: analysis
    provenance: original
    tags: [jobs, if-else, condition-task, task-values]
    stem: >-
      A check task runs dbutils.jobs.taskValues.set(key="has_new_files", value=True).
      The next task is an If/else condition with left
      {{tasks.check.values.has_new_files}}, operator EQUAL_TO and right True. The false
      branch runs every time, even on days with new files. Why, and what is the fix?
    options:
      A: Task values are stored as JSON, so the reference resolves to true in lower case, and EQUAL_TO compares strings exactly; set right to true.
      B: An If/else task cannot read task values, so left is always empty; pass the flag as a job parameter instead.
      C: Booleans cannot be stored as task values, so the set call stores nothing; store the string "yes" and compare with that.
      D: References resolve when the job starts, before the check task has run; make the If/else depend on the check task.
    correct: A
    explanation: >-
      A task value is serialised as JSON, so Python True travels as true, and the
      reference resolves to that text. EQUAL_TO and NOT_EQUAL compare strings, exactly
      and case-sensitively; only GREATER_THAN, LESS_THAN and their _OR_EQUAL forms compare
      numbers. In a run with this setup the condition against "True" came out false and the
      same condition against "true" came out true. Compare against the value's JSON text,
      or set a value whose text you control.
    distractor_rationale:
      B: >-
        If/else reads task values through the same {{tasks.<key>.values.<name>}} reference
        as any task; the problem is what the reference resolves to.
      C: >-
        The boolean is stored: a downstream notebook parameter set from the same reference
        received 'true'.
      D: >-
        A reference is resolved when the task that uses it runs, and an If/else that reads a
        task value already depends on that task; the reference resolved to true.
    near_misses:
      - text: >-
          Task values are stored as JSON, so the reference resolves to true in lower case, and
          EQUAL_TO compares numbers only; use GREATER_THAN with right 0.
        why: >-
          EQUAL_TO compares strings: against "true" the same condition came out true. And the
          ordering operators need numbers: GREATER_THAN failed with 'Numeric operand "left"
          is not a valid number. Actual value: true'.
      - text: >-
          Task values are stored as integers, so the reference resolves to 1, and EQUAL_TO
          compares strings exactly; set right to 1.
        why: >-
          The reference resolves to true, not 1: the same condition with right 1 came out
          false.
      - text: >-
          Task values are stored as integers, so the reference resolves to 1, and EQUAL_TO
          compares numbers only; use GREATER_THAN with right 0.
        why: >-
          The value is the JSON text true, which GREATER_THAN rejects: 'Numeric operand
          "left" is not a valid number. Actual value: true'.

  # ---------------------------------------------------------------- O10 task configuration
  - id: PRO-S1-Q019
    objective_ids: [PRO-S1-O10]
    difficulty: analysis
    provenance: original
    tags: [retries, idempotence, append, task-configuration]
    stem: >-
      A task appends the day's rows to a Delta table and occasionally fails after
      writing because a downstream notification call times out. It is configured with
      two retries. What is the consequence, and what is the right fix?
    options:
      A: Retries re-run the whole task, so the day's rows can be appended twice; make the write idempotent (overwrite the day's partition or MERGE) or disable retries.
      B: Retries resume from the failed step, so nothing is duplicated; no change is needed.
      C: Delta prevents duplicate appends automatically, so only the notification is repeated.
      D: Retries are ignored when the failure is in a network call; the task must be re-run by hand.
    correct: A
    explanation: >-
      A retry runs the task again from the start. A non-idempotent append then writes
      its rows a second time with no error. Either make the write safe to repeat, or
      do not retry a task whose work is not repeatable.
    distractor_rationale:
      B: Tasks have no resumable steps; a retry is a fresh execution.
      C: Delta guarantees atomic commits, not deduplication of two separate appends.
      D: Retries apply to any task failure; the network call failing is exactly what triggers one.
    near_misses:
      - text: >-
          Retries re-run the whole task, so the day's rows can be appended twice; lengthen
          min_retry_interval_millis so the notification service has recovered before the
          retry.
        why: >-
          A later retry still re-runs the append. Delay changes when the duplicate is written,
          not whether it is.
      - text: >-
          Retries re-run the whole task after rolling back the failed attempt's append, so the
          rows are written once; still, make the write idempotent (overwrite the day's
          partition or MERGE).
        why: >-
          Nothing is rolled back: each append is its own committed transaction. A task that
          appended and then failed, with two retries, left the rows three times.
      - text: >-
          Retries re-run the whole task after rolling back the failed attempt's append, so the
          rows are written once; lengthen min_retry_interval_millis so the notification
          service has recovered.
        why: >-
          Committed appends stay committed, so every attempt adds the rows again, however long
          the wait between attempts.

  - id: PRO-S1-Q020
    objective_ids: [PRO-S1-O10]
    difficulty: application
    provenance: original
    tags: [serverless, environment, dependencies, memory]
    stem: >-
      A notebook task on serverless compute needs a specific version of a library
      and, separately, fails with out-of-memory while building a large pandas frame on
      the driver. Which pair of configuration changes addresses both?
    options:
      A: Declare the library in the task's serverless environment; select the high-memory option for the notebook task.
      B: Add a %pip install cell; increase spark.sql.shuffle.partitions.
      C: Attach the library to the cluster; add executors to the cluster.
      D: Declare the library in the environment; set a retry so the task succeeds on a second attempt.
    correct: A
    explanation: >-
      On serverless, dependencies belong to the task's environment definition rather
      than ad hoc installs, and a driver-side memory need is met by the high-memory
      option (set in the notebook's Environment panel and used when it runs as a job
      task; only notebook tasks have it). Neither shuffle partitions nor retries change
      the memory available to the driver.
    distractor_rationale:
      B: Shuffle partitions affect executor-side parallelism, not a pandas frame held on the driver.
      C: Serverless has no cluster to attach libraries to or add executors to.
      D: A retry repeats the same out-of-memory failure with the same memory.
    near_misses:
      - text: >-
          Declare the library in the task's serverless environment; raise spark.driver.memory
          in the task's Spark configuration.
        why: >-
          Serverless does not let you set spark.driver.memory; setting it failed with
          CONFIG_NOT_AVAILABLE. Driver memory is chosen with the high-memory option.
      - text: >-
          List the library under the notebook task's libraries field; select the high-memory
          option for the notebook task.
        why: >-
          The job is rejected when saved: "Libraries field is not supported for serverless
          task, please specify libraries in environment".
      - text: >-
          List the library under the notebook task's libraries field; raise
          spark.driver.memory in the task's Spark configuration.
        why: >-
          Both are refused on serverless: a libraries field fails the job definition ("please
          specify libraries in environment"), and spark.driver.memory cannot be set.

  # ---------------------------------------------------------------- O11 testing
  - id: PRO-S1-Q021
    objective_ids: [PRO-S1-O11]
    difficulty: application
    provenance: original
    tags: [assertDataFrameEqual, assertSchemaEqual, transform, pytest]
    stem: >-
      A transformation is written as a function clean(df) and applied with
      df.transform(clean). A unit test builds a three-row input DataFrame and an
      expected DataFrame by hand, then calls assertDataFrameEqual(clean(input), expected).
      The test fails only because the expected frame has columns in a different order.
      What is the correct interpretation?
    options:
      A: assertDataFrameEqual compares schema including column order; either fix the expected frame's column order or assert on content in the order the contract specifies.
      B: assertDataFrameEqual ignores column order, so the failure must be a data difference.
      C: DataFrame.transform reorders columns, so the function under test is at fault.
      D: The test should compare with collect() and sorted() instead, which ignores column order.
    correct: A
    explanation: >-
      The testing utilities compare schema as well as content, and column order is
      part of the schema. Tests written against an explicit contract should build the
      expected frame in the contracted order, which also makes the test catch a
      contract violation. Row order, by contrast, is ignored unless checkRowOrder=True,
      and PySpark 4 adds ignoreColumnOrder=True for when column order genuinely does
      not matter.
    distractor_rationale:
      B: Column order is compared; the message names the schema mismatch.
      C: transform applies the function as written; it does not reorder columns by itself.
      D: Sorting collected rows does not ignore column order (the same data with swapped columns still compared unequal), and it loses type checking and the readable difference report.
    near_misses:
      - text: >-
          assertDataFrameEqual compares column order and row order by default; fix the
          expected frame's order of both, or assert in the order the contract specifies.
        why: >-
          Row order is ignored unless checkRowOrder=True; the same rows in a different order
          passed. Only the column order failed.
      - text: >-
          assertDataFrameEqual ignores column order unless checkRowOrder=True is passed, so
          the failure must be a data difference.
        why: >-
          checkRowOrder controls rows, not columns. Column order is part of the compared
          schema with default arguments; the swapped columns failed as a schema mismatch.
      - text: >-
          assertDataFrameEqual compares row order by default but ignores column order, so the
          failure must be a data difference in the expected rows.
        why: >-
          It is the other way round: rows in a different order passed, and the swapped columns
          failed.

  - id: PRO-S1-Q022
    objective_ids: [PRO-S1-O11]
    difficulty: analysis
    provenance: original
    tags: [testing, fixtures, integration-test, production-data]
    stem: >-
      A team's "unit tests" for a pipeline read yesterday's production output as the
      expected result and compare it to today's run of the same pipeline. The tests
      pass every day. What is the problem?
    options:
      A: The expected values come from the pipeline under test, so a bug present in both runs cannot be detected; expected data must be an independent hand-built fixture.
      B: Production data is too large for tests; sample it to make them faster.
      C: Nothing; comparing consecutive runs is a valid regression test.
      D: The tests should compare schemas only, since data changes daily.
    correct: A
    explanation: >-
      A test proves something only when its expected values are derived
      independently of the code under test. Tiny hand-built inputs with known correct
      outputs catch logic errors; comparing the pipeline to itself catches only
      differences between two runs.
    distractor_rationale:
      B: Size is a secondary concern; the flaw is where the expectation comes from.
      C: It detects change, not correctness; a long-standing bug passes every day.
      D: Schema checks belong in the suite too, but they do not test the transformation's logic.
    near_misses:
      - text: >-
          The expected values come from the pipeline under test, so a bug present in both runs
          cannot be detected; freeze one day's production output as a permanent golden file
          instead.
        why: >-
          A golden file captured from the pipeline still encodes whatever bugs it had that
          day. Expected values must be worked out independently.
      - text: >-
          The expected values come from the pipeline under test, so a failure in either run
          cannot be told apart from a bug; expected data must be an independent hand-built
          fixture.
        why: >-
          The risk is the opposite: the tests pass every day, and a bug present in both runs
          passes with them.
      - text: >-
          The expected values come from the pipeline under test, so a failure in either run
          cannot be told apart from a bug; freeze one day's production output as a permanent
          golden file instead.
        why: >-
          The tests pass every day, and a golden file taken from the pipeline still encodes
          its bugs. Only independently derived expectations test correctness.

  - id: PRO-S1-Q032
    objective_ids: [PRO-S1-O11]
    difficulty: application
    provenance: original
    tags: [assertDataFrameEqual, tolerance, floats, code]
    stem: >-
      A test compares an aggregate whose expected total is 10.0. Floating-point summation
      makes the actual value 10.0004, and the test fails. The test must pass for that
      value but still fail if the total is 10.05. Which arguments complete the call?
    code_language: python
    option_style: code
    code: |-
      from pyspark.testing import assertDataFrameEqual

      expected = spark.createDataFrame([("a", 10.0)], "k string, total double")
      assertDataFrameEqual(actual, expected, ________)
    options:
      A: |-
        rtol=1e-4
      B: |-
        rtol=0.1
      C: |-
        tolerance=1e-4
      D: |-
        checkRowOrder=True
    correct: A
    explanation: >-
      For float columns assertDataFrameEqual accepts |actual - expected| <= atol + rtol *
      |expected|, with defaults rtol=1e-05 and atol=1e-08. Against 10.0 the default allows
      about 0.0001, so 10.0004 fails. rtol=1e-4 widens that to about 0.001: 10.0004 passed
      and 10.05 still failed. Size a tolerance from the formula and the magnitude of the
      values, and keep it as tight as the arithmetic allows.
    distractor_rationale:
      B: >-
        rtol=0.1 allows a difference of about 1.0 at this magnitude, so 10.05 passed as
        well; the test no longer catches a real error.
      C: >-
        There is no tolerance argument: TypeError, "assertDataFrameEqual() got an unexpected
        keyword argument 'tolerance'".
      D: >-
        checkRowOrder concerns row order, not values; 10.0004 still failed with
        DIFFERENT_ROWS.
    near_misses:
      - text: |-
          atol=1e-4
        why: >-
          atol is added to rtol * |expected|, which stays at the default 1e-05 * 10. The
          allowance is about 0.0002, so 10.0004 still failed with DIFFERENT_ROWS.
      - text: |-
          rtol=1e-6
        why: >-
          This tightens the default rather than loosening it: the allowance drops to about
          0.00001 and 10.0004 failed.
      - text: |-
          atol=1e-6
        why: >-
          An absolute allowance of 0.000001 plus the default relative part is about 0.0001;
          10.0004 still failed.
