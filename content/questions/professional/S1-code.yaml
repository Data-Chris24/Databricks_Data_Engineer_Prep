# PRO-S1 — Developing Code for Data Processing (22%, the heaviest Professional section)
# Original questions written for this repository. Scenario-shaped: "what happens
# when", "which choice and why". Two per objective; Q001-Q003 (official samples)
# live in official-samples.yaml.
meta:
  source: Original, written for this repository.
  note: Covers PRO-S1-O1 through O11.

questions:
  # ---------------------------------------------------------------- O1 project structure
  - id: PRO-S1-Q004
    objective_ids: [PRO-S1-O1]
    difficulty: application
    provenance: original
    tags: [dabs, project-structure, targets, variables]
    stem: >-
      A team keeps two nearly identical job definitions in their bundle, prod_etl.yml
      and staging_etl.yml, differing only in the target schema and the schedule. A
      reviewer says the layout is wrong. Which change matches how a Declarative
      Automation Bundle is meant to be organised?
    options:
      A: One job definition; the schema and schedule become variables that the staging and prod targets override.
      B: Keep both files but move them under a shared/ folder so the duplication is at least visible.
      C: Merge them into one file with two job keys, prod_etl and staging_etl, so a single deploy creates both.
      D: Replace the YAML with a Python script that generates the right file for whichever environment is selected.
    correct: A
    explanation: >-
      A bundle expresses environment differences as targets overriding variables, not
      as copies of a resource. One definition deployed with -t staging or -t prod is
      the whole point: the resource is reviewed once and cannot drift between
      environments.
    distractor_rationale:
      B: Moving the copies does not remove the duplication; the two definitions can still drift.
      C: Two job keys in one file still deploys both jobs to every target, including the one that should not have them.
      D: Generating YAML from a script hides the configuration from review and from bundle validate.

  - id: PRO-S1-Q005
    objective_ids: [PRO-S1-O1]
    difficulty: analysis
    provenance: original
    tags: [dabs, development-mode, prefix, collaboration]
    stem: >-
      Two engineers deploy the same bundle to the same workspace from their laptops
      using a target with mode: development. Later the platform team deploys it from
      CI as a service principal. What does the workspace contain afterwards?
    options:
      A: Three copies of every resource, each prefixed with its deployer, and a paused schedule on each.
      B: One copy of every resource, owned by whoever deployed last.
      C: Two copies, because the service principal's deploy overwrites the first engineer's.
      D: A deploy error, because a bundle can only be deployed to a workspace once.
    correct: A
    explanation: >-
      Development mode prefixes resource names with the deployer's identity and
      pauses schedules, so each deployer gets an isolated copy. Three deployers,
      three copies. This is why development mode is safe for people and why
      production deployments use a single principal and production mode.
    distractor_rationale:
      B: Resources are namespaced by deployer in development mode; they do not overwrite each other.
      C: The service principal is a third deployer with its own prefix, not a replacement for anyone.
      D: A bundle can be deployed many times to one workspace; the prefix is what keeps them apart.

  # ---------------------------------------------------------------- O2 dependencies
  - id: PRO-S1-Q006
    objective_ids: [PRO-S1-O2]
    difficulty: application
    provenance: original
    tags: [pip, restart-python, dependencies, notebooks]
    stem: >-
      A notebook runs %pip install somepkg==2.1.0 in its first cell, then imports the
      package in the next cell and finds version 1.8.0 already loaded. What is the
      correct fix?
    options:
      A: Restart the Python process after the install, with %restart_python or dbutils.library.restartPython(), before importing.
      B: Use %sh pip install instead, which installs into the correct environment.
      C: Move the import above the install so the old version is never loaded.
      D: Install the package as a cluster library; %pip cannot change a version that is already installed.
    correct: A
    explanation: >-
      %pip changes the notebook session's environment, but a module already imported
      into the running Python process stays loaded until the process restarts. The
      restart is the documented step between installing and importing a different
      version.
    distractor_rationale:
      B: "%sh pip installs into the driver's shell environment, not necessarily the notebook's Python, and still would not unload the imported module."
      C: Importing first loads the old version, which is exactly the problem.
      D: "%pip can install a different version; the process just has to restart for the import to see it."

  - id: PRO-S1-Q007
    objective_ids: [PRO-S1-O2]
    difficulty: analysis
    provenance: original
    tags: [wheel, volumes, task-libraries, serverless-environment]
    stem: >-
      A job task must use an internal Python library that is not on PyPI. The team
      has a built wheel file. Which approach installs it for the task in a way that is
      reproducible across runs and workspaces?
    options:
      A: Upload the wheel to a Unity Catalog volume and declare it as a task library (or in the serverless environment) referencing that path.
      B: Copy the wheel into the notebook's folder and add a %pip install ./lib.whl cell at the top of the notebook.
      C: Unzip the wheel and append its folder to sys.path in the first cell.
      D: Push the wheel to a public PyPI mirror so a plain %pip install works everywhere.
    correct: A
    explanation: >-
      Task libraries and serverless environments install declared dependencies before
      the task starts, and a volume is governed storage that every workspace deploying
      the bundle can reference. The installation is part of the job's definition, not
      of the notebook's runtime behaviour.
    distractor_rationale:
      B: It works once, but the install is buried in the notebook, runs on every execution, and relative paths break when the notebook moves.
      C: Manipulating sys.path skips dependency resolution entirely and fails as soon as the library has its own dependencies.
      D: Publishing internal code to a public index is a security problem, not a packaging solution.

  # ---------------------------------------------------------------- O3 UDFs
  - id: PRO-S1-Q008
    objective_ids: [PRO-S1-O3]
    difficulty: analysis
    provenance: original
    tags: [pandas-udf, python-udf, performance, arrow]
    stem: >-
      A pipeline applies a Python function to 400 million rows using a scalar
      @udf and takes hours. The logic is pure arithmetic on two numeric columns.
      Which change delivers the largest improvement, and why?
    options:
      A: Rewrite the logic with built-in column expressions; it stays in the JVM and the optimiser can see through it.
      B: Convert the @udf to a pandas UDF; Arrow batches amortise serialisation, which is where most of the time goes.
      C: Increase spark.sql.shuffle.partitions so more executors share the UDF work.
      D: Cache the input DataFrame so the UDF is not recomputed for each downstream action.
    correct: A
    explanation: >-
      Pure arithmetic needs no UDF at all. Built-in expressions run inside the JVM
      with no per-row serialisation and remain visible to the optimiser, which beats
      even a vectorised UDF. A pandas UDF is the right answer only when a UDF is
      genuinely required.
    distractor_rationale:
      B: A pandas UDF is far faster than a scalar UDF, but it still ships data to Python; for arithmetic a built-in removes the cost entirely.
      C: A UDF's cost is per row, not per partition; more partitions do not change how many rows cross the Python boundary.
      D: Caching avoids recomputation across actions but does nothing about the per-row cost within one computation.

  - id: PRO-S1-Q009
    objective_ids: [PRO-S1-O3]
    difficulty: application
    provenance: original
    tags: [pandas-udf, series, batch]
    stem: >-
      Which statement about a pandas UDF declared with pandas_udf(returnType=DoubleType())
      that takes one pandas.Series and returns one is accurate?
    options:
      A: Spark hands it a batch of values at a time as a Series, transferred via Arrow, so the function must return a Series of the same length.
      B: Spark calls it once per row with a one-element Series, so it behaves like a scalar UDF with extra overhead.
      C: The function receives the entire column as a single Series, so it must fit in the driver's memory.
      D: It runs inside the JVM once the Series is converted, so it is as fast as a built-in.
    correct: A
    explanation: >-
      A scalar pandas UDF is vectorised over batches (spark.sql.execution.arrow.maxRecordsPerBatch
      controls the size). Each call receives a Series for the batch and must return a
      Series of the same length, which is what makes it much cheaper than a row-at-a-time UDF.
    distractor_rationale:
      B: That describes a scalar Python UDF; the pandas UDF's benefit is precisely the batching.
      C: Batches are bounded and processed on executors, not the whole column on the driver.
      D: The function is Python running in a Python worker; Arrow makes the transfer cheap but it is not JVM code.

  # ---------------------------------------------------------------- O4 pipelines + Auto Loader
  - id: PRO-S1-Q010
    objective_ids: [PRO-S1-O4]
    difficulty: application
    provenance: original
    tags: [auto-loader, cloudfiles, checkpoint, exactly-once]
    stem: >-
      A landing folder receives new JSON files every few minutes. A declarative
      pipeline reads it with Auto Loader into a streaming table. A file that was
      already processed is accidentally re-uploaded with the same name and content.
      What happens on the next update?
    options:
      A: Auto Loader ignores it, because its checkpoint records the file as already consumed.
      B: The rows are appended again, because Auto Loader processes whatever is present in the folder.
      C: The pipeline fails with a duplicate-file error that must be cleared manually.
      D: The streaming table is rebuilt from scratch to reconcile the folder with the table.
    correct: A
    explanation: >-
      Auto Loader tracks discovered files in its checkpoint and processes each file
      exactly once. An identical re-upload is not new to it. This is what makes a
      streaming table over a landing zone safe to re-run.
    distractor_rationale:
      B: That is what a plain batch read of the folder would do; Auto Loader's file tracking exists to prevent it.
      C: Nothing raises; the file is simply not re-processed.
      D: Streaming tables process incrementally; a full rebuild is what a materialized view does.

  - id: PRO-S1-Q011
    objective_ids: [PRO-S1-O4]
    difficulty: analysis
    provenance: original
    tags: [declarative-pipelines, expectations, dependency-graph]
    stem: >-
      A declarative pipeline defines bronze, silver and gold tables. The silver
      definition reads bronze; gold reads silver. An engineer asks where the task
      ordering is configured. What is the accurate answer?
    options:
      A: Nowhere; the pipeline derives the execution order from the table definitions' references to each other.
      B: In the pipeline settings, where each table lists its upstream tables under depends_on.
      C: In a job that wraps the pipeline, with one task per table and explicit dependencies.
      D: By file order; tables are materialised in the order their definitions appear.
    correct: A
    explanation: >-
      Declarative pipelines build the dependency graph from what each table reads.
      You describe the tables; the platform derives the order, parallelism and
      retries. That is the difference in abstraction level from a job of tasks.
    distractor_rationale:
      B: depends_on is a job-task concept; pipeline tables do not declare dependencies by hand.
      C: A job can trigger the pipeline as one task, but the ordering inside the pipeline is still derived.
      D: File and definition order do not matter; references do.

  # ---------------------------------------------------------------- O6 streaming tables vs MVs
  - id: PRO-S1-Q012
    objective_ids: [PRO-S1-O6]
    difficulty: analysis
    provenance: original
    tags: [streaming-table, materialized-view, updates, choice]
    stem: >-
      A source table receives new rows continuously, but a nightly correction job
      also updates a few percent of yesterday's rows. A downstream aggregate must
      reflect those corrections. Which object should hold the aggregate, and why?
    options:
      A: A materialized view, because it recomputes over the current source and so reflects updated rows.
      B: A streaming table, because it processes the source incrementally and is cheaper.
      C: A streaming table with skipChangeCommits, so the updates do not break the stream.
      D: Either; both objects reflect updates to source rows on the next refresh.
    correct: A
    explanation: >-
      A streaming table processes each source row once and does not revisit rows it
      already consumed, so a correction to an old row never reaches it. When old data
      changes, a materialized view is the object that stays correct.
    distractor_rationale:
      B: >-
        Cheaper, but wrong here: the corrected rows were already consumed and will not be re-read.
      C: skipChangeCommits keeps the stream running by skipping the update commits, which is exactly the data you need.
      D: The two differ precisely on this point; a streaming table does not reflect updates to consumed rows.

  - id: PRO-S1-Q013
    objective_ids: [PRO-S1-O6]
    difficulty: application
    provenance: original
    tags: [streaming-table, append-only, cost]
    stem: >-
      An events table only ever receives appends and has grown to billions of rows.
      A pipeline keeps a per-day count from it. The count is currently a materialized
      view that recomputes on every hourly refresh. What is the best change?
    options:
      A: Make it a streaming table; an append-only source lets it process only new rows each refresh.
      B: Keep the materialized view but refresh it daily instead of hourly.
      C: Replace it with a plain table rebuilt by a scheduled job.
      D: Add a partition on day to the source so the materialized view refresh reads less.
    correct: A
    explanation: >-
      When the source is append-only, a streaming table's cost is proportional to new
      data rather than to the whole query. Refreshing hourly then reads an hour of
      events instead of billions of rows.
    distractor_rationale:
      B: Reduces frequency, not the cost of each recompute, and lowers freshness.
      C: A scheduled rebuild is the same full recompute without the pipeline's bookkeeping.
      D: Layout helps a full scan somewhat, but the recompute is still over the whole history every refresh.

  # ---------------------------------------------------------------- O7 AUTO CDC
  - id: PRO-S1-Q014
    objective_ids: [PRO-S1-O7]
    difficulty: analysis
    provenance: original
    tags: [auto-cdc, apply-changes, sequence-by, out-of-order]
    stem: >-
      A change feed delivers two events for customer C7 out of order: first an update
      with seq_num 12 setting tier to gold, then an older update with seq_num 9 setting
      tier to silver. The target uses AUTO CDC with SEQUENCE BY seq_num. What is C7's
      tier in the target after both are applied?
    options:
      A: gold, because the event with the higher sequence wins regardless of arrival order.
      B: silver, because the most recently applied event overwrites the previous one.
      C: Both rows are kept, because the events have different sequence numbers.
      D: The update fails, because sequence numbers must arrive in increasing order.
    correct: A
    explanation: >-
      SEQUENCE BY defines which event is newest. A late-arriving event with a lower
      sequence is recognised as older and ignored. This is the first of the three
      things AUTO CDC handles that a hand-written upsert usually gets wrong.
    distractor_rationale:
      B: Arrival order carries no meaning under SEQUENCE BY; that is the point of specifying it.
      C: AUTO CDC maintains one current row per key; it is not an append of events.
      D: Out-of-order arrival is expected and handled, not an error.

  - id: PRO-S1-Q015
    objective_ids: [PRO-S1-O7]
    difficulty: application
    provenance: original
    tags: [auto-cdc, apply-as-delete, tombstone]
    stem: >-
      A CDC pipeline uses APPLY CHANGES INTO ... KEYS (id) SEQUENCE BY ts but omits
      the APPLY AS DELETE WHEN clause. The feed contains rows with op = 'delete'.
      What does the target contain for a key whose latest event is a delete?
    options:
      A: A row for the key, populated from the delete event's columns, because without the clause a delete is treated like any other upsert.
      B: No row, because rows with op = 'delete' are recognised by name.
      C: The row from the event before the delete, because deletes are ignored.
      D: An error at pipeline update time, because deletes require the clause.
    correct: A
    explanation: >-
      AUTO CDC only knows an event is a delete if you tell it which condition means
      delete. Without APPLY AS DELETE WHEN, the delete event is just the latest event
      for the key and is applied as an update, leaving a row that says "deleted"
      instead of removing it.
    distractor_rationale:
      B: The column name op has no special meaning; the clause supplies the condition.
      C: The delete event has the highest sequence, so it wins; it is applied as an upsert, not ignored.
      D: Nothing fails; the result is silently wrong, which is worse.

  # ---------------------------------------------------------------- O8 SS vs DLT
  - id: PRO-S1-Q016
    objective_ids: [PRO-S1-O8]
    difficulty: analysis
    provenance: original
    tags: [structured-streaming, declarative-pipelines, choice, foreachbatch]
    stem: >-
      A team must write each micro-batch to an external system with a custom
      idempotent upsert, control the trigger precisely, and manage watermarks for a
      stream-stream join. Which approach fits, and why?
    options:
      A: >-
        Structured Streaming; the requirements are about the mechanics (foreachBatch,
        triggers, watermarks) that a declarative pipeline abstracts away.
      B: A declarative pipeline; it manages checkpoints and triggers for you, so the custom sink becomes an expectation.
      C: A declarative pipeline with a materialized view over the external system.
      D: Either, since both support arbitrary sinks through the same API.
    correct: A
    explanation: >-
      Declarative pipelines are a different abstraction: you describe tables and the
      platform runs them. When the requirement is control over the mechanics, such as
      a custom sink via foreachBatch, explicit triggers and join watermarks, Structured
      Streaming is the tool.
    distractor_rationale:
      B: Expectations are data-quality rules, not sinks; a pipeline does not expose foreachBatch-style custom writes.
      C: Materialized views compute tables in the lakehouse; they do not write to external systems.
      D: They are not interchangeable; the pipeline deliberately hides what this team needs to control.

  # ---------------------------------------------------------------- O9 control flow
  - id: PRO-S1-Q017
    objective_ids: [PRO-S1-O9]
    difficulty: application
    provenance: original
    tags: [jobs, for-each, if-else, task-values]
    stem: >-
      A job must process a list of regions produced by its first task, running the
      same notebook once per region with at most three in parallel, and then run a
      summary task only if every region succeeded. Which job structure achieves this?
    options:
      A: The first task sets a task value with the regions; a For each task iterates over it with concurrency 3 running the notebook; the summary depends on it with run_if ALL_SUCCESS.
      B: One notebook task that loops over regions in Python, followed by the summary task.
      C: A separate task per region hard-coded in the job, followed by the summary task.
      D: An If/else task that checks each region in turn and runs the notebook for the ones that match.
    correct: A
    explanation: >-
      For each is the job-level loop: it takes a list (from a task value or a
      parameter), runs a nested task per element with a concurrency limit, and
      downstream tasks can depend on the whole loop with a run_if condition. The
      regions can then change at runtime without editing the job.
    distractor_rationale:
      B: A Python loop is sequential inside one task and gives no per-region run history, retries or concurrency.
      C: Hard-coding tasks fixes the region list in the job definition and cannot follow the first task's output.
      D: If/else branches on a condition; it does not iterate.

  - id: PRO-S1-Q018
    objective_ids: [PRO-S1-O9]
    difficulty: analysis
    provenance: original
    tags: [jobs, run-if, cleanup, failure]
    stem: >-
      A job has a load task and a cleanup task that removes temporary files. The
      cleanup must run whether the load succeeds or fails. How should the dependency
      be configured?
    options:
      A: cleanup depends on load with run_if set to ALL_DONE.
      B: cleanup depends on load with the default condition; failed upstream tasks still trigger dependants.
      C: Put the cleanup at the start of the job so it runs before anything can fail.
      D: Give the load task a retry so it never fails, making the default dependency sufficient.
    correct: A
    explanation: >-
      run_if controls when a dependant runs relative to its upstream tasks' outcomes.
      ALL_DONE runs the cleanup once the load has finished in any state, which is the
      pattern for tidy-up work. The default (ALL_SUCCESS) would skip it on failure.
    distractor_rationale:
      B: The default condition is ALL_SUCCESS; a failed upstream task skips the dependant.
      C: Cleaning up before the load leaves the files behind when the load fails, which is the case that matters.
      D: Retries reduce failures; they do not eliminate them, and a retry that gives up still skips the dependant.

  # ---------------------------------------------------------------- O10 task configuration
  - id: PRO-S1-Q019
    objective_ids: [PRO-S1-O10]
    difficulty: analysis
    provenance: original
    tags: [retries, idempotence, append, task-configuration]
    stem: >-
      A task appends the day's rows to a Delta table and occasionally fails after
      writing because a downstream notification call times out. It is configured with
      two retries. What is the consequence, and what is the right fix?
    options:
      A: Retries re-run the whole task, so the day's rows can be appended twice; make the write idempotent (overwrite the day's partition or MERGE) or disable retries.
      B: Retries resume from the failed step, so nothing is duplicated; no change is needed.
      C: Delta prevents duplicate appends automatically, so only the notification is repeated.
      D: Retries are ignored when the failure is in a network call; the task must be re-run by hand.
    correct: A
    explanation: >-
      A retry runs the task again from the start. A non-idempotent append then writes
      its rows a second time with no error. Either make the write safe to repeat, or
      do not retry a task whose work is not repeatable.
    distractor_rationale:
      B: Tasks have no resumable steps; a retry is a fresh execution.
      C: Delta guarantees atomic commits, not deduplication of two separate appends.
      D: Retries apply to any task failure; the network call failing is exactly what triggers one.

  - id: PRO-S1-Q020
    objective_ids: [PRO-S1-O10]
    difficulty: application
    provenance: original
    tags: [serverless, environment, dependencies, memory]
    stem: >-
      A notebook task on serverless compute needs a specific version of a library
      and, separately, fails with out-of-memory while building a large pandas frame on
      the driver. Which pair of configuration changes addresses both?
    options:
      A: Declare the library in the task's serverless environment; select the high-memory option for the notebook task.
      B: Add a %pip install cell; increase spark.sql.shuffle.partitions.
      C: Attach the library to the cluster; add executors to the cluster.
      D: Declare the library in the environment; set a retry so the task succeeds on a second attempt.
    correct: A
    explanation: >-
      On serverless, dependencies belong to the task's environment definition rather
      than ad hoc installs, and a driver-side memory need is met by the notebook
      task's high-memory option. Neither shuffle partitions nor retries change the
      memory available to the driver.
    distractor_rationale:
      B: Shuffle partitions affect executor-side parallelism, not a pandas frame held on the driver.
      C: Serverless has no cluster to attach libraries to or add executors to.
      D: A retry repeats the same out-of-memory failure with the same memory.

  # ---------------------------------------------------------------- O11 testing
  - id: PRO-S1-Q021
    objective_ids: [PRO-S1-O11]
    difficulty: application
    provenance: original
    tags: [assertDataFrameEqual, assertSchemaEqual, transform, pytest]
    stem: >-
      A transformation is written as a function clean(df) and applied with
      df.transform(clean). A unit test builds a three-row input DataFrame and an
      expected DataFrame by hand, then calls assertDataFrameEqual(clean(input), expected).
      The test fails only because the expected frame has columns in a different order.
      What is the correct interpretation?
    options:
      A: assertDataFrameEqual compares schema including column order; either fix the expected frame's column order or assert on content in the order the contract specifies.
      B: assertDataFrameEqual ignores column order, so the failure must be a data difference.
      C: DataFrame.transform reorders columns, so the function under test is at fault.
      D: The test should compare with collect() and sorted() instead, which ignores column order.
    correct: A
    explanation: >-
      The testing utilities compare schema as well as content, and column order is
      part of the schema. Tests written against an explicit contract should build the
      expected frame in the contracted order, which also makes the test catch a
      contract violation.
    distractor_rationale:
      B: Column order is compared; the message names the schema mismatch.
      C: transform applies the function as written; it does not reorder columns by itself.
      D: Comparing collected Python lists loses type checking and the readable difference report the utility provides.

  - id: PRO-S1-Q022
    objective_ids: [PRO-S1-O11]
    difficulty: analysis
    provenance: original
    tags: [testing, fixtures, integration-test, production-data]
    stem: >-
      A team's "unit tests" for a pipeline read yesterday's production output as the
      expected result and compare it to today's run of the same pipeline. The tests
      pass every day. What is the problem?
    options:
      A: The expected values come from the pipeline under test, so a bug present in both runs cannot be detected; expected data must be an independent hand-built fixture.
      B: Production data is too large for tests; sample it to make them faster.
      C: Nothing; comparing consecutive runs is a valid regression test.
      D: The tests should compare schemas only, since data changes daily.
    correct: A
    explanation: >-
      A test proves something only when its expected values are derived
      independently of the code under test. Tiny hand-built inputs with known correct
      outputs catch logic errors; comparing the pipeline to itself catches only
      differences between two runs.
    distractor_rationale:
      B: Size is a secondary concern; the flaw is where the expectation comes from.
      C: It detects change, not correctness; a long-standing bug passes every day.
      D: Schema checks belong in the suite too, but they do not test the transformation's logic.
