# PRO-S5 — Monitoring and Alerting (10%). Original questions.
meta:
  source: Original, written for this repository.
  note: Covers PRO-S5-O1 through O6.

questions:
  - id: PRO-S5-Q001
    objective_ids: [PRO-S5-O1]
    difficulty: application
    provenance: original
    tags: [system-tables, billing, cost]
    stem: >-
      Finance asks which SQL warehouses and jobs consumed the most DBUs last month,
      broken down by the cost-center tag on the compute. Which source answers this
      with one query?
    options:
      A: system.billing.usage, filtered by usage_date and grouped by SKU and the custom tag.
      B: system.access.audit, grouped by the workspace object that was accessed.
      C: DESCRIBE HISTORY on each table the jobs wrote to.
      D: The Jobs UI run list, exported to a spreadsheet.
    correct: A
    explanation: >-
      The billing usage system table records consumption per SKU with the compute's
      tags and identifiers, which is the governed, queryable source for cost by
      workload and by tag.
    distractor_rationale:
      B: >-
        The audit log records actions, not consumption; it cannot say how many DBUs a job used.
      C: >-
        Table history describes writes to a table, not compute cost.
      D: >-
        Run lists have durations, not DBUs or tags, and are not a joinable source.
    near_misses:
      - text: system.billing.list_prices, filtered by usage_date and grouped by SKU and the custom tag.
        why: >-
          list_prices holds the price of each SKU over time, not consumption. It has no
          usage_date, quantity or tags; filtering on usage_date fails with UNRESOLVED_COLUMN.
          Join it to usage for cost in dollars.
      - text: system.billing.usage, filtered by usage_date and grouped by SKU and the tag in usage_metadata.
        why: >-
          usage_metadata holds identifiers such as job_id, warehouse_id and cluster_id,
          not tags. The compute's tags are in the custom_tags map, read as
          custom_tags['cost_center'].
      - text: system.billing.list_prices, filtered by usage_date and grouped by SKU and the tag in usage_metadata.
        why: >-
          list_prices is a price list with no usage_date, usage_metadata or tags, so the
          query fails with UNRESOLVED_COLUMN. Usage, with tags in custom_tags, is in
          system.billing.usage.

  - id: PRO-S5-Q002
    objective_ids: [PRO-S5-O1]
    difficulty: analysis
    provenance: original
    tags: [system-tables, audit, lineage]
    stem: >-
      A sensitive table was read by an unexpected principal last week. Security
      wants every read of it with the caller's IP address, and a downstream team
      wants to know which tables were derived from it since. Which two system tables
      answer the two questions?
    options:
      A: >-
        system.access.audit for who read it, and system.access.table_lineage, filtered on
        the source table, for what was derived from it.
      B: system.billing.usage for who read it, and information_schema.tables for what was derived.
      C: system.access.table_lineage for both, since lineage records readers.
      D: DESCRIBE HISTORY for both, since it records every operation on the table.
    correct: A
    explanation: >-
      Audit records actions with the acting identity and the source IP address
      (reads included, as getTable and generateTemporaryTableCredential events);
      lineage records which tables were produced from which. They are different
      questions and different system tables.
    distractor_rationale:
      B: >-
        Billing has no reader identity per table, and information_schema has no lineage.
      C: >-
        Lineage does record a read, as a row with a source and no target and the
        reader in created_by, but it has no IP address; that is in the audit log.
      D: >-
        Table history records writes to that table; it does not know who read it or what was built from it.
    near_misses:
      - text: >-
          system.query.history for who read it, and system.access.table_lineage, filtered on
          the source table, for what was derived from it.
        why: >-
          Query history has executed_by and the statement text but no IP address, and it
          covers SQL warehouses and serverless compute only, so a read from a classic
          cluster is missing. The audit log has both.
      - text: >-
          system.access.audit for who read it, and system.access.table_lineage, filtered on
          the target table, for what was derived from it.
        why: >-
          Filtering lineage on target_table_full_name returns the tables the sensitive
          table was built from (upstream). What was derived from it are the rows where it
          is the source_table_full_name.
      - text: >-
          system.query.history for who read it, and system.access.table_lineage, filtered on
          the target table, for what was derived from it.
        why: >-
          Query history has no IP address and misses classic compute, and filtering
          lineage on the target table looks upstream. The reads are in the audit log; the
          derived tables are where the table is the source.

  - id: PRO-S5-Q003
    objective_ids: [PRO-S5-O2]
    difficulty: application
    provenance: original
    tags: [query-profile, spark-ui, which-tool]
    stem: >-
      A scheduled notebook job running on a classic job cluster has become slow. An
      engineer wants to know which stage of which Spark job in the run is
      responsible, and whether it spills. Which tool, and why not the other?
    options:
      A: >-
        The run's Spark UI, which shows stages and tasks with spill and shuffle metrics; the query profile shows one query's operators at a time, not the run's stages.
      B: >-
        The query profile, which shows every stage of the job; the Spark UI only lists jobs.
      C: >-
        DESCRIBE HISTORY on the output table, which records execution time per stage.
      D: >-
        system.compute tables, which record per-stage metrics for every run.
    correct: A
    explanation: >-
      The Spark UI is the per-run, per-stage view with task-level metrics such as
      spill and shuffle read. The query profile shows a single query as a plan of
      operators; on serverless compute, where the Spark UI is not available, it is
      the tool you have. Knowing which tool answers which question is the objective.
    distractor_rationale:
      B: >-
        Reversed: the profile is per query; the Spark UI is the stage-level view for job runs.
      C: >-
        Table history records write operations and their metrics, not Spark stages.
      D: >-
        Compute system tables describe clusters and warehouses, not stages within a run.
    near_misses:
      - text: >-
          The run's Spark UI, which shows stages and tasks with spill and shuffle metrics; the query profile exists only for queries run on a SQL warehouse.
        why: >-
          Query profiles also exist for notebooks and jobs on serverless compute, where
          they replace the Spark UI. The reason not to use one here is that it shows one
          query's operators, not the run's stages.
      - text: >-
          The cluster's compute metrics page, which shows stages and tasks with spill and shuffle metrics; the query profile shows one query's operators at a time, not the run's stages.
        why: >-
          Compute metrics chart CPU, memory, network and cluster-wide task and shuffle
          totals over time. There is no per-stage breakdown and no spill; those are in the
          Spark UI.
      - text: >-
          The cluster's compute metrics page, which shows stages and tasks with spill and shuffle metrics; the query profile exists only for queries run on a SQL warehouse.
        why: >-
          Compute metrics are cluster-wide utilisation charts without stages or spill,
          and query profiles also cover serverless notebooks and jobs. The stage view is
          the run's Spark UI.

  - id: PRO-S5-Q004
    objective_ids: [PRO-S5-O2]
    difficulty: analysis
    provenance: original
    tags: [query-profile, files-pruned, layout]
    stem: >-
      A SQL query's profile shows files read equal to files in the table and bytes
      read close to the table's size, although the query filters on a single
      customer_id. What does the profile tell you, and what is the fix?
    options:
      A: >-
        No file pruning happened for the filter; the table needs locality on the filtered column (cluster on it, or accept a full scan for a near-unique filter).
      B: >-
        The warehouse is undersized; scale it up so the scan is faster.
      C: >-
        The filter was applied after the scan because customer_id is a string; cast it to a number.
      D: >-
        The query cache was cold; the second run will read fewer files.
    correct: A
    explanation: >-
      Files read versus files pruned is the profile's data-skipping metric. Reading
      every file for a selective filter means the layout gives no locality on that
      column. If the filter column is a reasonable clustering key, clustering fixes
      it; if it is nearly unique, the scan is the honest cost.
    distractor_rationale:
      B: >-
        A bigger warehouse scans the same bytes faster; it does not reduce what is read.
      C: >-
        Filters on strings prune fine when statistics and locality exist; the type is irrelevant.
      D: >-
        An identical repeat may come from the result cache and read nothing, which hides
        the layout rather than fixing it: the next customer_id reads every file again.
    near_misses:
      - text: >-
          Statistics are missing for customer_id, so no file could be skipped; the table needs locality on the filtered column (cluster on it, or accept a full scan for a near-unique filter).
        why: >-
          The statistics are there: every file has a min and max for customer_id, but
          each file's range spans almost every id, so none can be skipped. ANALYZE TABLE
          changes nothing; 64 of 64 files are still read.
      - text: >-
          No file pruning happened for the filter; the files need compacting (run OPTIMIZE, or accept a full scan for a near-unique filter).
        why: >-
          Plain OPTIMIZE bin-packs files without ordering rows, so each new file still
          spans the whole range of customer_id and none is pruned. Clustering on the
          column took the same query from 64 files read to 1 read and 133 pruned.
      - text: >-
          Statistics are missing for customer_id, so no file could be skipped; the files need compacting (run OPTIMIZE, or accept a full scan for a near-unique filter).
        why: >-
          File statistics exist and plain OPTIMIZE does not co-locate ids, so the query
          still reads every file. The ranges overlap; only clustering on customer_id
          gives the files ranges that can be skipped.

  - id: PRO-S5-Q005
    objective_ids: [PRO-S5-O3]
    difficulty: application
    provenance: original
    tags: [jobs-api, cli, run-output, monitoring]
    stem: >-
      A monitoring script needs the exit value a notebook task returned with
      dbutils.notebook.exit(), for the latest run of a job. Which sequence of API
      calls or CLI commands gets it?
    options:
      A: >-
        List the job's runs to get the latest run id, get the run to find the task's run id, then get-run-output on the task run id.
      B: >-
        Get the job definition; the last exit value is stored on the job.
      C: >-
        Call get-run on the job run id; the exit value is in the run's state message.
      D: >-
        Query system.lakeflow.job_run_timeline, which stores notebook exit values.
    correct: A
    explanation: >-
      Notebook output belongs to the task run, not the job run. runs/list finds the
      run, runs/get exposes each task's run id, and runs/get-output on that id returns
      the notebook_output with the exit value. This is how the study app reads a grade.
    distractor_rationale:
      B: >-
        Job definitions hold settings, not run results.
      C: >-
        The state message is a status string; outputs are a separate endpoint on the task run.
      D: >-
        The run timeline system table records timings and states, not notebook outputs.
    near_misses:
      - text: >-
          List the job's runs to get the latest run id, get the run to find the task's run id, then get-run-output on the job run id.
        why: >-
          get-run-output on a job run id fails, even for a job with one task: "Retrieving
          the output of runs with multiple tasks is not supported. Please retrieve the
          output of each individual task run instead."
      - text: >-
          Get the job to find the latest run id, get the run to find the task's run id, then get-run-output on the task run id.
        why: >-
          jobs get returns the job's settings, creator and creation time, with no run ids.
          The latest run comes from list-runs on the job.
      - text: >-
          Get the job to find the latest run id, get the run to find the task's run id, then get-run-output on the job run id.
        why: >-
          The job definition has no run ids, and get-run-output on a job run id fails with
          "Retrieving the output of runs with multiple tasks is not supported". Output is
          read from the task run.

  - id: PRO-S5-Q006
    objective_ids: [PRO-S5-O3]
    difficulty: analysis
    provenance: original
    tags: [jobs-api, trends, automation]
    stem: >-
      A team notices that a job's runtime has doubled over three months, but nobody
      saw it happen because every run succeeded. What monitoring change would have
      surfaced it?
    options:
      A: >-
        Pull run durations on a schedule through the Jobs API (or system tables) into a table and alert on the trend, since success state alone hides gradual slowdowns.
      B: >-
        Enable failure notifications on the job so the team is emailed when it fails.
      C: >-
        Add a retry to the job so slow runs are re-attempted.
      D: >-
        Increase the job's timeout so slow runs are marked failed sooner.
    correct: A
    explanation: >-
      A green run is not evidence of health. Durations collected over time turn a
      gradual regression into a visible trend; the API is how that collection outlives
      a person watching a dashboard.
    distractor_rationale:
      B: >-
        The runs never failed, so failure notifications never fire.
      C: >-
        Retries respond to failures; they do nothing about slow successes.
      D: >-
        A tighter timeout converts slow runs into failures, which is a blunt alert and loses the output.
    near_misses:
      - text: >-
          Pull run termination codes on a schedule through the Jobs API (or system tables) into a table and alert on the trend, since slow runs end with a warning code.
        why: >-
          A slow run that succeeds ends with termination code SUCCESS, the same as a fast
          one; there is no code for slow. The trend is only in the durations.
      - text: >-
          Pull each run's duration through the Jobs API (or system tables) as it finishes and alert when it is 20% slower than the run before, since success state alone hides gradual slowdowns.
        why: >-
          Doubling over about ninety daily runs is under 1% per run, so no run is ever 20%
          slower than the one before it. A drift shows only against a longer baseline.
      - text: >-
          Pull each run's termination code through the Jobs API (or system tables) as it finishes and alert when it differs from the run before, since slow runs end with a warning code.
        why: >-
          Every run ended with SUCCESS, so the code never changes and the alert never
          fires. Durations against a longer baseline show the slowdown.

  - id: PRO-S5-Q007
    objective_ids: [PRO-S5-O4]
    difficulty: application
    provenance: original
    tags: [pipeline-event-log, expectations, data-quality]
    stem: >-
      A declarative pipeline has an expectation that drops rows failing a rule. Data
      consumers ask how many rows have been dropped per day over the last month. Where
      is that recorded?
    options:
      A: >-
        In the pipeline's event log, which records expectation pass and fail counts for every update and can be queried as a table.
      B: >-
        In the target table's DESCRIBE HISTORY, which lists rows dropped per commit.
      C: >-
        Nowhere; dropped rows are discarded without a count.
      D: >-
        In system.access.audit under the pipeline's principal.
    correct: A
    explanation: >-
      The event log is the pipeline's record: flows, updates, errors and per-expectation
      counts of passed and failed rows, with the dropped count per flow. Querying it as
      a table (event_log() or a published event log) is how quality is trended rather
      than read off one run's page.
    distractor_rationale:
      B: >-
        Table history records the write's operation metrics, not which expectation rejected what.
      C: >-
        Counts are kept precisely so quality can be monitored; only the rows themselves are dropped.
      D: >-
        The audit log records who did what, not data-quality outcomes.
    near_misses:
      - text: >-
          In the pipeline's event log, which keeps every dropped row with the expectation it failed and can be queried as a table.
        why: >-
          The event log keeps counts (passed_records and failed_records per expectation,
          dropped_records per flow), not the rows. To keep rejected rows, route them to a
          quarantine table yourself.
      - text: >-
          In system.lakeflow.pipeline_update_timeline, which records expectation pass and fail counts for every update and can be queried as a table.
        why: >-
          That system table records each update's type, trigger, result state, compute
          and timings. It has no data-quality columns; expectation counts are in the event
          log's flow_progress events.
      - text: >-
          In system.lakeflow.pipeline_update_timeline, which keeps every dropped row with the expectation it failed and can be queried as a table.
        why: >-
          The update timeline has no data-quality columns, and dropped rows are not kept
          anywhere. The counts live in the pipeline's event log.

  - id: PRO-S5-Q008
    objective_ids: [PRO-S5-O4]
    difficulty: analysis
    provenance: original
    tags: [pipeline-event-log, failure, error-class]
    stem: >-
      A pipeline update failed overnight. The engineer wants the error class and the
      flow that raised it, plus which expectations were violated before the failure.
      Which single source has all of it?
    options:
      A: The pipeline event log, filtered to that update's id.
      B: The Jobs run list, which shows the failing task's error.
      C: The driver logs of the pipeline's cluster.
      D: system.billing.usage, filtered to the pipeline's SKU.
    correct: A
    explanation: >-
      Every pipeline update writes its flows, expectation results and errors (with
      error class and message) to the event log. It is the one place that ties the
      failure to the data-quality picture leading up to it.
    distractor_rationale:
      B: >-
        A job that triggers the pipeline shows that the task failed, not the pipeline's internal flows or expectations.
      C: >-
        Driver logs are raw and unstructured, and not available on serverless pipelines.
      D: >-
        Billing has cost, not errors.
    near_misses:
      - text: The pipeline event log, filtered to level = 'ERROR'.
        why: >-
          That keeps the error but drops the expectation results, which arrive in
          flow_progress events at other levels. Filtering on origin.update_id keeps both.
      - text: system.lakeflow.pipeline_update_timeline, filtered to that update's id.
        why: >-
          The update timeline has the update's result state and timings, not flows,
          error classes or expectation results.
      - text: system.lakeflow.pipeline_update_timeline, filtered to level = 'ERROR'.
        why: >-
          The update timeline has no level column, so the filter fails with
          UNRESOLVED_COLUMN; it has no flows or expectations either. Both are in the event
          log.

  - id: PRO-S5-Q009
    objective_ids: [PRO-S5-O5]
    difficulty: analysis
    provenance: original
    tags: [sql-alerts, threshold, seasonality, baseline]
    stem: >-
      A SQL alert fires when a daily row count drops below a fixed floor. It fires
      every Saturday and Sunday, when volume is legitimately lower, and never fired
      during a slow month-long decline on weekdays. What is the design flaw?
    options:
      A: >-
        A fixed threshold on a seasonal metric; compare each day with a baseline of the same day type and alert on sustained downward deviation from it.
      B: >-
        The floor is set too high; lower it until weekends stop firing.
      C: >-
        The alert should run hourly instead of daily.
      D: >-
        Alerts cannot detect gradual declines; only a dashboard can.
    correct: A
    explanation: >-
      A fixed threshold is honest only when the metric is stationary. With a weekly
      cycle, any floor above weekend volume fires every weekend and any floor below
      it never catches a weekday decline. A same-day-type rolling baseline compares
      like with like.
    distractor_rationale:
      B: >-
        Lowering the floor stops the weekend noise and guarantees the weekday decline is never caught.
      C: >-
        Frequency does not fix a comparison that is wrong in kind.
      D: >-
        A baseline-relative condition detects gradual declines well; the alert just needs the right query.
    near_misses:
      - text: >-
          A fixed threshold on a seasonal metric; compare each day with the average of the previous seven days and alert on sustained downward deviation from it.
        why: >-
          A seven-day mean mixes weekdays with weekends, so every Saturday and Sunday sits
          well below it and the weekend alerts continue. The baseline has to be the same
          day type.
      - text: >-
          A fixed threshold on a seasonal metric; compare each day with a baseline of the same day type and alert on any deviation from it beyond the threshold.
        why: >-
          Any deviation includes upward spikes, so a busy day fires too. Only a sustained
          drop means volume is being lost.
      - text: >-
          A fixed threshold on a seasonal metric; compare each day with the average of the previous seven days and alert on any deviation from it beyond the threshold.
        why: >-
          The mixed seven-day mean keeps weekends firing, and any deviation adds upward
          spikes. Compare like days, and alert on a sustained drop.

  - id: PRO-S5-Q010
    objective_ids: [PRO-S5-O5]
    difficulty: application
    provenance: original
    tags: [sql-alerts, persistence, false-positives, direction]
    stem: >-
      An alert on a pipeline metric fires on any day more than 15% below its
      baseline. It also fired on the one day a marketing campaign doubled volume,
      because the query used absolute deviation. Which two changes make the alert
      trustworthy?
    options:
      A: >-
        Alert only on the downward direction, and require the condition to hold for several consecutive days before firing.
      B: >-
        Raise the deviation to 50% and notify a second person.
      C: >-
        Switch the comparison to the previous day rather than a baseline.
      D: >-
        Disable the alert on days with campaigns.
    correct: A
    explanation: >-
      Unusual is not a useful condition; the direction that means something is a
      drop. Requiring persistence trades a day of latency for an alert people
      believe. SQL alerts have no setting for consecutive evaluations, so the
      persistence goes in the query. An alert that cries wolf is ignored, and then
      the real one is too.
    distractor_rationale:
      B: >-
        A looser threshold delays detection and still fires on a big enough upward spike.
      C: >-
        Day-over-day comparisons amplify noise and still treat a spike as an anomaly.
      D: >-
        Manual exceptions do not scale and leave the alert firing on the next benign spike.
    near_misses:
      - text: >-
          Measure the deviation as a percentage of the baseline instead of in rows, and require the condition to hold for several consecutive days before firing.
        why: >-
          A percentage is still unsigned while the absolute value stays in the query: a
          doubling is +100%, far past 15%. The sign is what has to change.
      - text: >-
          Alert only on the downward direction, and set the alert to notify just once until the metric returns to normal.
        why: >-
          Notifying once per trigger is already the default (retrigger_seconds unset). It
          limits repeat notifications, not what triggers: a one-day dip still fires.
          Persistence has to be written into the query.
      - text: >-
          Measure the deviation as a percentage of the baseline instead of in rows, and set the alert to notify just once until the metric returns to normal.
        why: >-
          An unsigned percentage still fires on the campaign day, and notify-once is the
          default and only throttles repeats. Neither the direction nor persistence
          changes.

  - id: PRO-S5-Q011
    objective_ids: [PRO-S5-O6]
    difficulty: application
    provenance: original
    tags: [job-notifications, duration-warning, health]
    stem: >-
      A job normally finishes in 20 minutes. The team wants to be told when a run
      is still going after 60 minutes, even though it may still succeed, and when it
      fails. Where is this configured?
    options:
      A: >-
        On the job: a failure notification plus a health rule on run duration (RUN_DURATION_SECONDS) with a notification destination such as a Slack channel.
      B: >-
        In a SQL alert over system.lakeflow.job_run_timeline that runs every minute.
      C: >-
        In the notebook, with a timer thread that emails after 60 minutes.
      D: >-
        By setting the job timeout to 60 minutes, which sends a failure notification.
    correct: A
    explanation: >-
      Jobs carry notification settings for start, success and failure, and health
      rules for duration and streaming backlog that notify while the run is still in
      progress. Destinations are configured once and reused across jobs.
    distractor_rationale:
      B: >-
        Possible but indirect and laggy; the job's own health rule exists for exactly this.
      C: >-
        Code inside the task cannot observe the task from outside and dies with it.
      D: >-
        A timeout kills the run at 60 minutes; the requirement was to be warned while it continues.
    near_misses:
      - text: >-
          On the job: a failure notification plus a health rule on streaming backlog (STREAMING_BACKLOG_SECONDS) with a notification destination such as a Slack channel.
        why: >-
          Backlog metrics measure how far a stream lags its source. A batch notebook has
          no stream, so the rule never fires; run time is RUN_DURATION_SECONDS.
      - text: >-
          On the job: a start notification plus a health rule on run duration (RUN_DURATION_SECONDS) with a notification destination such as a Slack channel.
        why: >-
          A start notification fires when each run begins, not when it fails, so a failed
          run is never announced. The failure needs on_failure.
      - text: >-
          On the job: a start notification plus a health rule on streaming backlog (STREAMING_BACKLOG_SECONDS) with a notification destination such as a Slack channel.
        why: >-
          Start fires at the beginning of every run rather than on failure, and a batch
          job has no streaming backlog to measure. Neither event the team asked for is
          covered.

  - id: PRO-S5-Q012
    objective_ids: [PRO-S5-O6]
    difficulty: recall
    provenance: original
    tags: [job-notifications, destinations, channel]
    stem: >-
      Which is the recommended way to route job failure notifications so they keep
      working when the engineer who set them up leaves the team?
    options:
      A: >-
        A shared notification destination (a Slack channel, Teams channel, PagerDuty service or webhook), set up once by a workspace admin and added to the job, not an individual's email.
      B: >-
        The job owner's email, since ownership transfers automatically.
      C: >-
        No notifications; rely on the run list being checked each morning.
      D: >-
        A personal webhook on the engineer's laptop.
    correct: A
    explanation: >-
      Notify a channel, not a person. Notification destinations are workspace-level
      objects an admin creates once and many jobs reuse, and a channel survives
      personnel changes and holidays.
    distractor_rationale:
      B: >-
        Ownership does not transfer on its own, and a personal inbox is a single point of failure.
      C: >-
        Manual checking is the failure mode notifications exist to replace.
      D: >-
        A laptop is offline more often than a service.
    near_misses:
      - text: >-
          A shared webhook URL (a Slack channel, Teams channel, PagerDuty service or webhook), set up once by a workspace admin and added to the job, not an individual's email.
        why: >-
          A job takes the id of a notification destination, not a URL. Adding one fails:
          "Invalid webhook id ... Webhook IDs must be valid UUIDs."
      - text: >-
          A shared notification destination (a Slack channel, Teams channel, PagerDuty service or webhook), set up by the job owner and added to the job, not an individual's email.
        why: >-
          Destinations are workspace objects that a workspace admin creates; a job owner
          can only pick one that exists. That is what lets many jobs reuse it.
      - text: >-
          A shared webhook URL (a Slack channel, Teams channel, PagerDuty service or webhook), set up by the job owner and added to the job, not an individual's email.
        why: >-
          Jobs reject a raw URL ("Webhook IDs must be valid UUIDs"), and destinations are
          created by a workspace admin, not per job by its owner.
