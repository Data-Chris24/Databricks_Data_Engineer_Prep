# PRO-S7 — Ensuring Data Security and Compliance (10%). Original questions; Q001 is
# an official sample in official-samples.yaml.
meta:
  source: Original, written for this repository.
  note: Covers PRO-S7-O1 through O5.

questions:
  - id: PRO-S7-Q002
    objective_ids: [PRO-S7-O1]
    difficulty: application
    provenance: original
    tags: [acl, least-privilege, groups, grants]
    stem: >-
      An analyst needs to query one table, sales.orders, and nothing else in the
      catalog. Which set of grants is least privilege?
    options:
      A: >-
        USE CATALOG on the catalog, USE SCHEMA on sales, and SELECT on sales.orders, granted to a group the analyst belongs to.
      B: >-
        SELECT on the catalog, so the analyst can read any table they need later.
      C: >-
        SELECT on sales.orders only; traversal privileges are implied by a table grant.
      D: >-
        Ownership of sales.orders, since owners can always read.
    correct: A
    explanation: >-
      A table grant is inert without the traversal privileges to reach it, so the
      minimum is the two USE privileges plus SELECT on the one table. Granting to a
      group keeps the grant stable when people change.
    distractor_rationale:
      B: >-
        SELECT on the catalog inherits to every table in it, far beyond one table.
      C: >-
        USE CATALOG and USE SCHEMA are not implied; without them the SELECT cannot be exercised.
      D: >-
        Ownership carries every privilege including granting to others; it is the opposite of least privilege.
    near_misses:
      - text: >-
          USE CATALOG on the catalog, USE SCHEMA on sales, and SELECT on the sales schema, granted to a group the analyst belongs to.
        why: >-
          SELECT on a schema is inherited by every current and future table and view in
          it, so the analyst can read all of sales, not one table.
      - text: >-
          BROWSE on the catalog, USE SCHEMA on sales, and SELECT on sales.orders, granted to a group the analyst belongs to.
        why: >-
          BROWSE shows names and metadata without access to the data. Reading the table
          still needs USE CATALOG, so the query is refused.
      - text: >-
          BROWSE on the catalog, USE SCHEMA on sales, and SELECT on the sales schema, granted to a group the analyst belongs to.
        why: >-
          BROWSE does not stand in for USE CATALOG, so nothing can be queried; and once
          it is fixed, SELECT on the schema opens every table in sales.

  - id: PRO-S7-Q003
    objective_ids: [PRO-S7-O1]
    difficulty: analysis
    provenance: original
    tags: [workspace-acl, jobs, can-manage-run, service-principal]
    stem: >-
      An application must trigger an existing job and read its run output, and must
      not be able to edit the job. Which workspace permission on the job fits?
    options:
      A: CAN_MANAGE_RUN, which allows triggering, cancelling and reading runs without changing the definition.
      B: CAN_VIEW, which allows triggering runs read-only.
      C: CAN_MANAGE, which is required to trigger runs.
      D: IS_OWNER, since only owners can start jobs.
    correct: A
    explanation: >-
      Job permission levels are graded: CAN_VIEW sees runs, CAN_MANAGE_RUN can
      trigger and cancel them, CAN_MANAGE can edit the job, IS_OWNER has everything.
      Least privilege for a trigger-and-read caller is CAN_MANAGE_RUN.
    distractor_rationale:
      B: >-
        CAN_VIEW cannot trigger a run.
      C: >-
        CAN_MANAGE also permits editing the definition, which the requirement forbids.
      D: >-
        Ownership is far more than the task needs.
    near_misses:
      - text: CAN_VIEW, which allows triggering, cancelling and reading runs without changing the definition.
        why: >-
          CAN_VIEW only views run results. Triggering and cancelling start at
          CAN_MANAGE_RUN.
      - text: CAN_MANAGE_RUN, which allows triggering and reading runs but not cancelling them or changing the definition.
        why: >-
          The level is right but the description is not: CAN_MANAGE_RUN can view,
          trigger and cancel runs. Only editing the job is withheld.
      - text: CAN_VIEW, which allows triggering and reading runs but not cancelling them or changing the definition.
        why: >-
          CAN_VIEW cannot trigger anything, and no job permission level splits
          triggering from cancelling; both come with CAN_MANAGE_RUN.

  - id: PRO-S7-Q004
    objective_ids: [PRO-S7-O2]
    difficulty: application
    provenance: original
    tags: [column-mask, row-filter, functions]
    stem: >-
      HR must see salaries, everyone else must see NULL, and regional managers must
      see only rows for their region. Which combination implements this on one table?
    options:
      A: >-
        A column mask function on salary that returns the value for the HR group and NULL otherwise, plus a row filter function on region.
      B: >-
        Two views, one per audience, and grants on the views.
      C: >-
        A row filter alone, since it can also blank columns.
      D: >-
        A column mask alone, since it can also drop rows.
    correct: A
    explanation: >-
      Masks decide what a viewer sees in a column; filters decide which rows a viewer
      sees. Both are SQL functions attached to the table and applied at query time
      to everyone, so the one table serves every audience correctly.
    distractor_rationale:
      B: >-
        Views can work, but they multiply objects and leave the base table readable by anyone granted on it.
      C: >-
        A row filter cannot change column values.
      D: >-
        A column mask cannot remove rows.
    near_misses:
      - text: >-
          A column mask function on salary that returns the value for the HR group and NULL otherwise, plus a row filter function on region, both set on a view over the table.
        why: >-
          Row filters and column masks attach to tables, not views. ALTER VIEW ... SET
          MASK fails with PARSE_SYNTAX_ERROR; a view does its own filtering in its query.
      - text: >-
          A row filter function on salary that returns the value for the HR group and NULL otherwise, plus a column mask function on region.
        why: >-
          The roles are swapped. A row filter must return BOOLEAN: one returning the
          salary is attached anyway, then every query on the table fails with
          DATATYPE_MISMATCH.FILTER_NOT_BOOLEAN. A mask cannot drop rows either.
      - text: >-
          A row filter function on salary that returns the value for the HR group and NULL otherwise, plus a column mask function on region, both set on a view over the table.
        why: >-
          Neither works on a view (ALTER VIEW ... SET MASK is a syntax error), and a
          filter returning a salary fails with DATATYPE_MISMATCH.FILTER_NOT_BOOLEAN.

  - id: PRO-S7-Q005
    objective_ids: [PRO-S7-O2]
    difficulty: analysis
    provenance: original
    tags: [column-mask, deletion, compliance, limits]
    stem: >-
      A regulation requires that a national identifier must not be stored in a
      published table. A team applies a column mask that hides it from everyone but
      one admin group and declares the requirement met. What is wrong?
    options:
      A: >-
        A mask hides a value from readers; the value is still stored, and the table owner or anyone with MANAGE on it can drop the mask. Storing an irreversible hash (or nothing) is what meets "must not be stored".
      B: >-
        Nothing; a mask is the standard way to satisfy storage restrictions.
      C: >-
        The mask should be a row filter instead.
      D: >-
        Masks cannot be applied to string columns, so the statement failed.
    correct: A
    explanation: >-
      Masks and filters are access controls, not data-minimisation. A requirement
      about what may be held is met by not holding it: hash it irreversibly (salted
      if the input space is small) or suppress the column.
    distractor_rationale:
      B: >-
        A stored-but-masked identifier is still stored.
      C: >-
        A row filter removes rows, not a column's stored value.
      D: >-
        Masks apply to any column type.
    near_misses:
      - text: >-
          A mask hides a value from readers; the value is still stored, and the table owner or anyone with MANAGE on it can drop the mask. Encrypting the column with aes_encrypt is what meets "must not be stored".
        why: >-
          Ciphertext is the identifier in reversible form: aes_decrypt with the key
          returns the original value, so the identifier is still held.
      - text: >-
          A mask hides a value from readers; the value is still stored, and anyone can read it unmasked by time travelling to a version before the mask. Storing an irreversible hash (or nothing) is what meets "must not be stored".
        why: >-
          Time travel is refused on a masked table, with
          COLUMN_MASKS_FEATURE_NOT_SUPPORTED.TIME_TRAVEL. The way round the mask is
          dropping it, which needs ownership or MANAGE.
      - text: >-
          A mask hides a value from readers; the value is still stored, and anyone can read it unmasked by time travelling to a version before the mask. Encrypting the column with aes_encrypt is what meets "must not be stored".
        why: >-
          Time travel on a masked table fails with
          COLUMN_MASKS_FEATURE_NOT_SUPPORTED.TIME_TRAVEL, and encrypted values are still
          held: aes_decrypt with the key gives them back.

  - id: PRO-S7-Q006
    objective_ids: [PRO-S7-O3]
    difficulty: analysis
    provenance: original
    tags: [hashing, salt, low-entropy, anonymisation]
    stem: >-
      A team pseudonymises date of birth with an unsalted SHA-256 hash so records can
      still be grouped by birthday. A reviewer says the column is effectively still
      plaintext. Why?
    options:
      A: >-
        There are only about 40,000 plausible dates of birth; hashing every one of them and matching reveals every value. Low-entropy inputs need a salt kept away from the data.
      B: >-
        SHA-256 is reversible with enough compute.
      C: >-
        Hashing a date produces the same output for everyone born in the same year.
      D: >-
        Dates cannot be hashed because they are not strings.
    correct: A
    explanation: >-
      Hashing is irreversible in principle, but a small input space can be
      enumerated: hash every candidate and compare. A salt kept out of the dataset
      makes the enumeration useless. Email addresses are high-entropy; birthdays and
      postcodes are not.
    distractor_rationale:
      B: >-
        The hash is not reversed; the input space is enumerated.
      C: >-
        Same input gives the same hash; different dates give different hashes.
      D: >-
        Any value can be hashed once represented as bytes; the type is not the issue.
    near_misses:
      - text: >-
          There are only about 40,000 plausible dates of birth; hashing every one of them and matching reveals every value. Low-entropy inputs need a longer hash such as SHA-512.
        why: >-
          The length of the output does not matter when the inputs can be listed:
          hashing all 40,543 dates from 1915 to 2025 with sha2(..., 512) finds the match
          just as fast.
      - text: >-
          There are only about 40,000 plausible dates of birth; hashing every one of them and matching reveals every value. Low-entropy inputs need a salt stored in a column beside the hash.
        why: >-
          A salt the reader can see is just part of the input. Prepend it to every
          candidate date and the enumeration finds the value as before; the salt has to
          be kept away from the data.
      - text: >-
          There are only about 40,000 plausible dates of birth; hashing every one of them and matching reveals every value. Low-entropy inputs need a longer hash such as SHA-512, salted with a value stored beside the hash.
        why: >-
          Neither change stops enumeration: a longer hash is computed just as easily, and
          a visible salt is added to each candidate before hashing.

  - id: PRO-S7-Q007
    objective_ids: [PRO-S7-O3]
    difficulty: application
    provenance: original
    tags: [tokenisation, generalisation, suppression, choice]
    stem: >-
      A dataset must be shared with a research partner. Customers must be groupable
      across tables, the partner must never recover identities, but the company must
      be able to re-identify a record if a customer later exercises a rights request.
      Which technique for the customer identifier fits?
    options:
      A: >-
        Tokenisation, with the token vault kept by the company; tokens are consistent for grouping and reversible only with the vault.
      B: >-
        Suppression, since removing the identifier is the safest option.
      C: >-
        Generalisation to the customer's country, which preserves aggregates.
      D: >-
        An unsalted hash, which is consistent and irreversible.
    correct: A
    explanation: >-
      Choose the technique by what the data still has to do. Consistent grouping
      plus reversibility for the data owner alone is tokenisation. Hashing loses the
      reversibility; suppression loses grouping; generalisation loses both.
    distractor_rationale:
      B: >-
        Without an identifier the partner cannot group a customer's records.
      C: >-
        A country is not a customer; grouping by customer is impossible.
      D: >-
        Irreversible means the company cannot re-identify on request either.
    near_misses:
      - text: >-
          Tokenisation, with the token vault shared with the partner; tokens are consistent for grouping and reversible only with the vault.
        why: >-
          Whoever holds the vault can turn tokens back into identities. Handing it to
          the partner breaks the one rule the partner must not be able to break.
      - text: >-
          Encryption with aes_encrypt, with the key kept by the company; ciphertexts are consistent for grouping and reversible only with the key.
        why: >-
          aes_encrypt defaults to GCM with a random IV, so the same identifier encrypts
          differently every time and a customer's rows cannot be grouped.
      - text: >-
          Encryption with aes_encrypt, with the key shared with the partner; ciphertexts are consistent for grouping and reversible only with the key.
        why: >-
          With the key the partner can decrypt every identifier, and default (GCM)
          ciphertexts differ on every call, so they do not group either.

  - id: PRO-S7-Q008
    objective_ids: [PRO-S7-O4]
    difficulty: analysis
    provenance: original
    tags: [pii-detection, free-text, regexp, streaming]
    stem: >-
      A pipeline masks the email and phone columns of a support-ticket table before
      publishing. An audit finds customer email addresses in the published table.
      Where are they, and what does a compliant pipeline do differently?
    options:
      A: >-
        Inside the free-text notes column; a compliant pipeline detects PII patterns in every text column with regexp_replace, in the batch and streaming paths alike, rather than masking only known columns.
      B: >-
        In the table history; the pipeline should VACUUM after publishing.
      C: >-
        In the column names; the pipeline should rename columns.
      D: >-
        Nowhere; the audit is mistaken because the email column is masked.
    correct: A
    explanation: >-
      Masking the columns you know hold PII is the easy half. Free text is where it
      hides, so a compliant pipeline applies pattern detection to text columns as
      a transformation step shared by batch and streaming writes.
    distractor_rationale:
      B: >-
        History retention is a separate concern; the audit found values in the current published data.
      C: >-
        Column names are not the leak.
      D: >-
        The masked column is fine; the notes column is not.
    near_misses:
      - text: >-
          Inside the free-text notes column; a compliant pipeline detects PII patterns in every text column with regexp_extract, in the batch and streaming paths alike, rather than masking only known columns.
        why: >-
          regexp_extract returns the matched text, so applied to the notes it keeps the
          email address and throws away everything else. Masking needs regexp_replace.
      - text: >-
          Inside the free-text notes column; a compliant pipeline detects PII patterns in every text column with regexp_replace in the batch path, since regex functions are not supported on streaming DataFrames.
        why: >-
          regexp_replace runs on a streaming DataFrame like any column expression; a
          stream with trigger(availableNow=True) wrote the masked notes. Skipping the
          stream leaks every ticket it carries.
      - text: >-
          Inside the free-text notes column; a compliant pipeline detects PII patterns in every text column with regexp_extract in the batch path, since regex functions are not supported on streaming DataFrames.
        why: >-
          regexp_extract keeps the match rather than removing it, and regex functions
          work on streaming DataFrames, so the stream needs the same masking.

  - id: PRO-S7-Q009
    objective_ids: [PRO-S7-O4]
    difficulty: application
    provenance: original
    tags: [transform, batch-and-streaming, reuse]
    stem: >-
      A team implements PII masking as a function apply_masks(df) that returns a
      DataFrame, and wants the identical logic in a nightly batch job and in a
      Structured Streaming job. What is the correct way to reuse it?
    options:
      A: >-
        Call df.transform(apply_masks) in both; a transformation function works on a static DataFrame and on a streaming one alike.
      B: >-
        Copy the function into each notebook, since streaming DataFrames need a different API.
      C: >-
        Use foreachBatch in the batch job so both paths run the same micro-batch code.
      D: >-
        Only the streaming job can use it; batch must re-implement it in SQL.
    correct: A
    explanation: >-
      DataFrame transformations are the same API whether the DataFrame is static or
      streaming. Packaging the logic as a function and applying it with transform
      gives one implementation, one test suite, and no drift between the two paths.
    distractor_rationale:
      B: >-
        Column-level transformations are identical on streaming DataFrames.
      C: >-
        foreachBatch is a streaming sink construct; a batch job has no micro-batches.
      D: >-
        The function is plain DataFrame code and runs in either job.
    near_misses:
      - text: >-
          Call df.transform(apply_masks) in the batch job, and in the streaming job only inside foreachBatch; transform is not available on a streaming DataFrame.
        why: >-
          transform works on a streaming DataFrame directly: the result is still
          streaming and writes with writeStream. foreachBatch is not needed for it.
      - text: >-
          Call df.foreach(apply_masks) in both; a function passed to foreach works on a static DataFrame and on a streaming one alike.
        why: >-
          foreach calls the function once per Row and returns nothing, so the batch run
          fails in the Python worker (a Row has no withColumn). On a streaming DataFrame
          it fails with "Queries with streaming sources must be executed with
          writeStream.start()".
      - text: >-
          Call df.foreach(apply_masks) in the batch job, and in the streaming job only inside foreachBatch; foreach is not available on a streaming DataFrame.
        why: >-
          foreach hands the function single Rows and returns nothing, so the batch job
          fails in the Python worker; the function wants a DataFrame and belongs in
          transform.

  - id: PRO-S7-Q010
    objective_ids: [PRO-S7-O5]
    difficulty: analysis
    provenance: original
    tags: [erasure, delete, time-travel, vacuum, deletion-vectors]
    stem: >-
      A customer requests erasure. The team runs DELETE FROM records WHERE
      subject_id = 'C42' and confirms the row is gone with a SELECT. A week later an
      auditor retrieves the row. How, and what was missing?
    options:
      A: >-
        Through time travel: DELETE removes rows from the current version only. Erasure needs REORG TABLE ... APPLY (PURGE) to rewrite files carrying deletion vectors, then VACUUM once deletedFileRetentionDuration has passed, so the old files are removed.
      B: >-
        Through a backup the auditor restored; the pipeline should not keep backups.
      C: >-
        The DELETE was never committed because Delta requires an explicit COMMIT.
      D: >-
        The row was re-inserted by a streaming job; erasure needs the stream stopped.
    correct: A
    explanation: >-
      Earlier versions still contain deleted rows; that is what time travel is for.
      With deletion vectors, on by default for new tables, DELETE does not even
      rewrite the file: it marks the row deleted, and the file holding it stays in the
      current version where VACUUM never touches it. REORG TABLE ... APPLY (PURGE)
      rewrites those files; VACUUM then removes the old ones once the retention
      window has passed. Shortening that window to finish sooner gives up time travel
      over it, which is right for an erasure request and wrong as a table's default.
    distractor_rationale:
      B: >-
        No external backup is needed to explain it; the table's own history has the row.
      C: >-
        Delta commits each statement atomically; there is no separate COMMIT.
      D: >-
        A re-insert would show in the current version's SELECT; the auditor read an old version.
    near_misses:
      - text: >-
          Through time travel: DELETE removes rows from the current version only. Erasure needs VACUUM once deletedFileRetentionDuration has passed, so the old files are removed; deletion vectors need no extra step.
        why: >-
          With deletion vectors DELETE only marks the row, and the file holding it is
          still part of the current version, so VACUUM keeps it. REORG TABLE ... APPLY
          (PURGE) has to rewrite it first.
      - text: >-
          Through time travel: DELETE removes rows from the current version only. Erasure needs REORG TABLE ... APPLY (PURGE) to rewrite files carrying deletion vectors, then OPTIMIZE once deletedFileRetentionDuration has passed, so the old files are removed.
        why: >-
          OPTIMIZE writes new files and marks the old ones removed, but leaves them in
          storage: after DELETE and OPTIMIZE, time travel to the earlier version still
          returned the row. Only VACUUM deletes files.
      - text: >-
          Through time travel: DELETE removes rows from the current version only. Erasure needs OPTIMIZE once deletedFileRetentionDuration has passed, so the old files are removed; deletion vectors need no extra step.
        why: >-
          OPTIMIZE never deletes files: after DELETE and OPTIMIZE the earlier version
          still returned the row. Removing old files is VACUUM's job, and on a
          deletion-vector table REORG TABLE ... APPLY (PURGE) has to run first.

  - id: PRO-S7-Q011
    objective_ids: [PRO-S7-O5]
    difficulty: application
    provenance: original
    tags: [retention, purge, policy-per-category]
    stem: >-
      A retention policy says support tickets are kept for one year, marketing
      events for 90 days and transaction logs for seven years. A purge job deletes
      everything older than one year. What is the consequence?
    options:
      A: >-
        Marketing events are kept nine months too long and transaction logs are destroyed six years early; the cutoff must be per record type.
      B: >-
        Nothing; one year is a reasonable average.
      C: >-
        Only the marketing events are affected, since transaction logs are exempt from purging.
      D: >-
        The job fails, because Delta rejects deletes spanning multiple categories.
    correct: A
    explanation: >-
      A single cutoff is a bug in both directions: it over-retains the category
      with the shortest period and destroys the category with the longest. Retention
      is a cutoff per category, applied with the record type in the predicate.
    distractor_rationale:
      B: >-
        Averages do not satisfy any of the three obligations.
      C: >-
        Nothing exempts transaction logs from a DELETE that does not check the type.
      D: >-
        The DELETE runs happily; the harm is silent.
    near_misses:
      - text: >-
          Marketing events are kept nine months too long and transaction logs are destroyed six years early; the cutoff must be the longest period, seven years, so nothing is lost.
        why: >-
          A seven-year cutoff stops the destruction but keeps tickets six years and
          marketing events nearly seven years past their limits. Each type needs its own.
      - text: >-
          Marketing events are destroyed nine months early and transaction logs are kept six years too long; the cutoff must be per record type.
        why: >-
          The directions are reversed. A one-year cutoff keeps a 90-day record nine
          months extra and deletes a seven-year record six years early.
      - text: >-
          Marketing events are destroyed nine months early and transaction logs are kept six years too long; the cutoff must be the longest period, seven years, so nothing is lost.
        why: >-
          The harms run the other way (marketing over-kept, logs destroyed), and a
          seven-year cutoff over-retains every shorter category.

  - id: PRO-S7-Q014
    objective_ids: [PRO-S7-O2]
    difficulty: analysis
    provenance: original
    tags: [row-filter, column-mask, ctas, downstream-copies]
    stem: >-
      The employees table has a row filter on region and a mask on salary; members
      of hr pass both. A nightly job running as a service principal in hr builds
      reporting.employees with CREATE TABLE AS SELECT * FROM employees, and analysts
      outside hr are granted SELECT on the copy. What do the analysts see?
    options:
      A: >-
        Every row with the real salary. The job stored what it was allowed to see, and the copy has no row filter or mask of its own.
      B: >-
        Only their own region's rows with salary NULL, because a CTAS copies the row filter and mask onto the new table.
      C: >-
        Nothing; reading the copy also requires SELECT on employees, which they do not have.
      D: >-
        An error; a table with a row filter or column mask cannot be the source of a CREATE TABLE AS SELECT.
    correct: A
    explanation: >-
      Row filters and column masks are evaluated when a table is read, for whoever
      reads it; they do not travel with the data. A CTAS stores the result the writer
      saw, with no policy attached, so a privileged job writes raw values into an
      unprotected table and a restricted writer writes masked ones. Copies of
      protected data need their own filter and mask, or should be built from data
      that is already de-identified.
    distractor_rationale:
      B: >-
        The copy is a new table with no policy; DESCRIBE TABLE EXTENDED on it shows no Row Filter or Column Masks rows.
      C: >-
        The copy is an independent table. SELECT on it, with USE CATALOG and USE SCHEMA, is all a reader needs.
      D: >-
        The CTAS runs; the filter and mask are applied while the source is read, as for any query.
    near_misses:
      - text: >-
          Every row with the real salary is stored, but the copy keeps the row filter and mask of the source, so they see only their own region with salary NULL.
        why: >-
          Nothing is carried over: DESCRIBE TABLE EXTENDED on the copy shows no Row
          Filter or Column Masks rows, and the analysts read the raw values the job stored.
      - text: >-
          Salary is stored as NULL in every row, because a CTAS evaluates the mask without the writer's group membership; the copy has no row filter or mask of its own.
        why: >-
          The mask runs for the writer like any other reader. A CTAS run by the
          principal the mask lets through stored the real salaries; only a restricted
          writer stores masked ones.
      - text: >-
          Salary is stored as NULL in every row, because a CTAS evaluates the mask without the writer's group membership, and the copy keeps the row filter and mask of the source.
        why: >-
          The privileged writer stored real salaries, and the copy has no policy at all,
          so the analysts see every row unmasked.

  - id: PRO-S7-Q015
    objective_ids: [PRO-S7-O4]
    difficulty: analysis
    provenance: original
    tags: [pii-detection, streaming, checkpoint, backfill]
    stem: >-
      A Structured Streaming job reads bronze.tickets, masks phone numbers in notes
      with regexp_replace and appends to silver.tickets. An audit finds that the
      pattern missed numbers written as (555) 987 6543, and thousands of such rows are
      already in silver. The team fixes the pattern. What else makes silver compliant?
    options:
      A: >-
        Restart the stream on its existing checkpoint, and run a one-off UPDATE on silver.tickets that applies the corrected pattern to the rows already written.
      B: >-
        Nothing; restarting with the new code makes the stream reprocess bronze, so every existing row is masked again.
      C: >-
        Add a column mask on silver.tickets.notes so readers no longer see the numbers.
      D: >-
        Run OPTIMIZE on silver.tickets so the rows are rewritten through the new pattern.
    correct: A
    explanation: >-
      A streaming query processes each source row once: the checkpoint records how far
      it has read, so new code applies only to rows that arrive after the restart.
      Data already written by the old logic has to be corrected separately, here with
      a batch UPDATE on the target. Changing the source instead breaks the stream, and
      a fresh checkpoint re-reads the source and appends it a second time. A fix to
      masking logic always has two parts: the code going forward and a backfill of
      what it already produced.
    distractor_rationale:
      B: >-
        The checkpoint marks the old bronze rows as processed; after the restart only new rows went through the fixed pattern and the old ones still held the numbers.
      C: >-
        A mask hides the value from readers but leaves it stored in silver, which is what the audit is about.
      D: >-
        OPTIMIZE compacts files without changing any values.
    near_misses:
      - text: >-
          Restart the stream on its existing checkpoint, and run a one-off UPDATE on bronze.tickets that applies the corrected pattern, so the stream carries the corrected rows into silver.
        why: >-
          An UPDATE on a streaming source stops the stream: the restart failed with
          DELTA_SOURCE_TABLE_IGNORE_CHANGES. Silver keeps the leaked rows either way.
      - text: >-
          Restart the stream on a new checkpoint location, and run a one-off UPDATE on silver.tickets that applies the corrected pattern to the rows already written.
        why: >-
          The old rows are fixed, but a fresh checkpoint re-reads all of bronze and
          appends it again: every ticket ended up in silver twice.
      - text: >-
          Restart the stream on a new checkpoint location, and run a one-off UPDATE on bronze.tickets that applies the corrected pattern, so the stream carries the corrected rows into silver.
        why: >-
          The fresh checkpoint appends a corrected copy of every ticket next to the old
          rows, so silver holds each ticket twice and the leaked versions stay.
