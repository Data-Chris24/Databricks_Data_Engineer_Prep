# ASSOC-S4 — Working with Lakeflow Jobs (16%)
meta:
  source: Original, written for this repository.
  note: Covers ASSOC-S4-O1 through O4.

questions:
  # ---------------------------------------------------------------- O1 control flow
  - id: ASSOC-S4-Q001
    objective_ids: [ASSOC-S4-O1]
    difficulty: analysis
    provenance: original
    tags: [retries, idempotency, failure]
    stem: >-
      A job task writes to a Delta table and is configured with max_retries = 3. The
      task fails partway through its third write, then succeeds on retry. What must be
      true of the task for the final table to be correct?
    options:
      A: >-
        The task must be idempotent - rerunning it from the start must not duplicate
        work already committed.
      B: >-
        Nothing extra. Databricks rolls back everything a failed attempt wrote before
        retrying.
      C: The task must write with mode("append") so the retry adds only new rows.
      D: The retry count must be 1, because higher values risk duplication.
    correct: A
    explanation: >-
      A retry reruns the task from the beginning. Delta gives ACID guarantees per write
      operation, not across a whole task - so writes the failed attempt already
      committed are still there. If the retry blindly appends the same data again, you
      get duplicates. Idempotent design (overwrite a partition, MERGE on a key, or a
      checkpoint) is what makes retries safe, and it is the reason retries are a design
      decision rather than a checkbox.
    distractor_rationale:
      B: >-
        There is no task-level transaction. Individual writes committed before the
        failure remain committed.
      C: >-
        Append is precisely the mode that duplicates on retry. It is the problem, not the
        fix.
      D: >-
        Reducing retries does not make a non-idempotent task safe - a single retry can
        duplicate just as thoroughly.
    near_misses:
      - text: >-
          The task must be idempotent - the retry resumes at the write that failed, so only
          that write must be safe to repeat.
        why: >-
          A retry reruns the whole task from its first line. A task that appended a row and
          then failed left two rows after its successful retry, not one.
      - text: >-
          Nothing extra - the retry resumes at the write that failed, and Delta has already
          rolled that write back.
        why: >-
          A retry does not resume, it starts over, and only the write that failed is undone.
          Every write committed before the failure stays, so it is written again.
      - text: >-
          Nothing extra - rerunning it from the start is safe, because a failed attempt's
          committed writes are rolled back first.
        why: >-
          There is no task-level rollback. A task that appended a row and then failed left
          two rows after its successful retry.

  - id: ASSOC-S4-Q002
    objective_ids: [ASSOC-S4-O1]
    difficulty: application
    provenance: original
    tags: [conditional, if-else, control-flow]
    stem: >-
      A pipeline should run an expensive reprocessing task only when an upstream check
      reports that data drifted. Which Lakeflow Jobs feature expresses this directly?
    options:
      A: An If/else condition task that branches on a value the check task returns.
      B: A task with a retry policy that fails until the condition is met.
      C: Two separate jobs, with the second triggered manually when needed.
      D: A single task containing an if statement in its notebook.
    correct: A
    explanation: >-
      Conditional task branching is built into Lakeflow Jobs: a condition evaluates a
      value - often a task value set by an earlier task - and downstream tasks run or
      are skipped accordingly. Keeping the branch in the job graph rather than inside a
      notebook means the decision is visible in the run history, so you can see which
      path a given run took.
    distractor_rationale:
      B: Retries handle failure, not choice. Deliberately failing to express a condition is a misuse.
      C: Manual triggering removes the automation the requirement asks for.
      D: >-
        This works but hides the decision. The task always shows as run, and the skipped
        path leaves no trace in the run graph.
    near_misses:
      - text: An If/else condition task that branches on a job parameter the check task sets.
        why: >-
          Job parameters are fixed when the run starts, so a task cannot set one. The check
          task publishes a task value, and the condition reads it as
          {{tasks.check.values.drifted}}.
      - text: A Run if dependency condition that branches on a job parameter the check task sets.
        why: >-
          Run if conditions only test whether upstream tasks succeeded or failed, and no task
          can set a job parameter mid-run. Both details are wrong.
      - text: A Run if dependency condition that branches on a value the check task returns.
        why: >-
          Run if (All succeeded, At least one failed and so on) looks only at whether
          dependencies succeeded or failed, never at a value. Using it here means making the
          check fail to say "drifted".

  - id: ASSOC-S4-Q003
    objective_ids: [ASSOC-S4-O1]
    difficulty: recall
    provenance: original
    tags: [for-each, loops, parameters]
    stem: >-
      A job must run the same notebook once for each of twelve source regions. Which
      approach uses Lakeflow Jobs as intended?
    options:
      A: A For each task that iterates over the list of regions, passing each as a parameter.
      B: Twelve separate tasks, each hardcoding one region.
      C: One task whose notebook loops over regions internally.
      D: Twelve separate jobs on the same schedule.
    correct: A
    explanation: >-
      A For each task runs one iteration per input value, giving per-region visibility in
      the run graph, per-iteration retries, and controllable concurrency - without
      twelve copies of the same definition to keep in step. Adding a thirteenth region
      becomes a data change rather than a job change.
    distractor_rationale:
      B: >-
        Twelve near-identical tasks drift apart the moment one is edited, and adding a
        region means editing the job.
      C: >-
        An internal loop works but is opaque: one region failing fails the whole task,
        and a retry redoes all twelve.
      D: Twelve jobs multiplies the maintenance without adding anything.
    near_misses:
      - text: >-
          A For each task that runs a SQL query listing the regions, passing each as a
          parameter.
        why: >-
          A For each task's inputs are a JSON array, or a reference such as
          {{tasks.list.values.regions}} that resolves to one. It runs no query; an earlier
          task can query a table and set the list as a task value.
      - text: >-
          A For each task that runs a SQL query listing the regions, setting each as a task
          value the notebook reads.
        why: >-
          The inputs are an array, not a query, and each iteration receives its value through
          the {{input}} reference in the nested task's parameters, not as a task value.
      - text: >-
          A For each task that iterates over the list of regions, setting each as a task
          value the notebook reads.
        why: >-
          Nothing sets a task value per iteration. The nested task maps {{input}} into a
          parameter, and the notebook reads it with dbutils.widgets.get.

  # ---------------------------------------------------------------- O2 tasks/DAG
  - id: ASSOC-S4-Q004
    objective_ids: [ASSOC-S4-O2]
    difficulty: analysis
    provenance: original
    tags: [dag, dependencies, failure-propagation]
    stem: >-
      A job has tasks A, B, C and D. B and C both depend on A. D depends on both B and
      C. Task C fails and has no retries. What is the resulting state?
    options:
      A: A and B complete successfully; C fails; D is skipped because a dependency failed.
      B: A completes; B, C and D all fail.
      C: A and B complete; C fails; D runs anyway using B's output.
      D: The whole job is rolled back, leaving no changes committed.
    correct: A
    explanation: >-
      Dependencies control ordering and propagation, not atomicity. B has no relationship
      with C so it completes normally, while D cannot run because one of the tasks it
      depends on did not succeed - it is skipped with the status Upstream failed, not
      Failed, because it never started. Anything A and B
      committed to the lakehouse stays committed; the job is not a transaction.
    distractor_rationale:
      B: B does not depend on C and is unaffected by its failure.
      C: >-
        D depends on both. A task runs only when all of its dependencies have succeeded.
      D: >-
        There is no job-level rollback. This is the most consequential misconception in
        this section - each write committed independently.
    near_misses:
      - text: >-
          A completes; B is skipped; C fails; D is skipped because a dependency failed.
        why: >-
          A failure only stops the tasks downstream of it. B depends on A alone, so it
          still runs and succeeds.
      - text: >-
          A completes; B is skipped; C fails; D fails because a dependency failed.
        why: >-
          B depends only on A and succeeds. D never starts, so it is not Failed: it is
          skipped with the status Upstream failed.
      - text: >-
          A and B complete successfully; C fails; D fails because a dependency failed.
        why: >-
          D never starts, so it has nothing to fail. It is skipped, and its status is
          Upstream failed rather than Failed.

  - id: ASSOC-S4-Q005
    objective_ids: [ASSOC-S4-O2]
    difficulty: recall
    provenance: original
    tags: [task-types, sql-task, pipeline-task]
    stem: >-
      Which of these is NOT something a single Lakeflow Jobs task can be configured to
      run directly?
    options:
      A: An arbitrary shell script on the driver node.
      B: A notebook.
      C: A SQL query, alert or dashboard refresh.
      D: A Lakeflow Declarative Pipeline.
    correct: A
    explanation: >-
      Task types cover notebooks, Python scripts and wheels, SQL (queries, alerts,
      dashboard refreshes), declarative pipelines, dbt, JARs and nested jobs. There is no
      "run this shell command" task type - shell work happens inside a notebook or
      script task. Knowing the available types matters because choosing the right one
      gives you the right monitoring for free.
    distractor_rationale:
      B: Notebook is the most common task type.
      C: SQL tasks cover queries, alerts and dashboard refreshes.
      D: A pipeline task orchestrates a declarative pipeline as a step in a larger job.
    near_misses:
      - text: An arbitrary Python script on the driver node.
        why: >-
          A Python script task runs a .py file directly, with parameters passed as
          command-line arguments. Only shell commands have no task type of their own.
      - text: An arbitrary Python script from a Git repository.
        why: >-
          A Python script task can run a file from the workspace or from a Git repository,
          so this is a supported task.
      - text: An arbitrary dbt project from a Git repository.
        why: >-
          A dbt task runs dbt commands against a project, and it can take the project
          straight from a Git repository.

  - id: ASSOC-S4-Q006
    objective_ids: [ASSOC-S4-O2]
    difficulty: application
    provenance: original
    tags: [task-values, parameters, passing-data]
    stem: >-
      Task A computes a row count that task B needs. What is the intended way to pass it?
    options:
      A: Task values - A sets a value, B reads it via the task's output reference.
      B: Write the count to a global temporary view that B queries.
      C: Save the count to a file in DBFS and have B read the file.
      D: Pass it as a job parameter set before the run begins.
    correct: A
    explanation: >-
      Task values exist for exactly this: small pieces of data handed from one task to
      the next, visible in the run history so you can see what was passed. They also make
      conditional branching possible, since a condition can test a task value.
    distractor_rationale:
      B: >-
        Tasks may run on different compute, and a temporary view does not survive across
        them. On serverless it does not even get that far: creating a global temporary
        view fails with NOT_SUPPORTED_WITH_SERVERLESS.
      C: >-
        This works but reinvents task values with a file to clean up and no visibility in
        the run history.
      D: >-
        Job parameters are fixed before the run starts, so they cannot carry something
        computed during it.
    near_misses:
      - text: >-
          Notebook exit value - A returns it with dbutils.notebook.exit, B reads it via the
          task's output reference.
        why: >-
          An exit value is the run's output, not a task value. Referencing it as
          {{tasks.A.values.result}} failed before B started: "Task value referenced by
          'tasks.A.values.result' was not found".
      - text: >-
          Notebook exit value - A returns it with dbutils.notebook.exit, B reads it as a job
          parameter.
        why: >-
          An exit value never becomes a task value or a job parameter, and job parameters
          are fixed when the run starts. A must call dbutils.jobs.taskValues.set.
      - text: Task values - A sets a value, B reads it as a job parameter.
        why: >-
          A task value does not become a job parameter. B reads it through
          {{tasks.A.values.row_count}} in its own task parameters, or with
          dbutils.jobs.taskValues.get.

  # ---------------------------------------------------------------- O3/O4 triggers
  - id: ASSOC-S4-Q007
    objective_ids: [ASSOC-S4-O3, ASSOC-S4-O4]
    difficulty: analysis
    provenance: original
    tags: [file-arrival-trigger, scheduling, cost]
    stem: >-
      A partner drops a file into cloud storage at an unpredictable time, usually
      between 01:00 and 06:00. Downstream reports must be ready as soon as possible
      after it lands. Which trigger fits best?
    options:
      A: A file arrival trigger on the landing location.
      B: A scheduled run every 15 minutes from 01:00 to 07:00.
      C: A scheduled run at 06:00, after the file is certain to have arrived.
      D: A continuous job that polls the directory.
    correct: A
    explanation: >-
      When the requirement is "as soon as the data lands" and arrival time is
      unpredictable, a file arrival trigger matches the event directly - the job runs
      once, promptly, and only when there is something to process. Polling schedules
      trade latency against wasted runs, and a fixed time forces you to plan for the
      worst case every day.
    distractor_rationale:
      B: >-
        Up to 24 empty runs a night, and still up to 15 minutes of latency after the file
        arrives.
      C: >-
        Guarantees the reports are late whenever the file lands early, which is most of
        the time.
      D: A continuous job keeps compute alive all night to watch a directory.
    near_misses:
      - text: A file arrival trigger on the bronze table the file is loaded into.
        why: >-
          A file arrival trigger watches a Unity Catalog volume or external location path,
          and cannot watch a path holding tables. The bronze table changes only after this
          job loads the file, so the trigger is circular.
      - text: A table update trigger on the bronze table the file is loaded into.
        why: >-
          The bronze table changes only when this job loads the file, so waiting for that
          change means the job never starts.
      - text: A table update trigger on the landing location.
        why: >-
          A table update trigger watches Unity Catalog tables and views, not storage paths.
          A directory of partner files is not a table, so watching it needs a file arrival
          trigger.

  - id: ASSOC-S4-Q008
    objective_ids: [ASSOC-S4-O4]
    difficulty: application
    provenance: original
    tags: [table-update-trigger, dependencies, data-driven]
    stem: >-
      A gold aggregation job must run whenever an upstream silver table is updated, but
      the upstream job's schedule changes often. Which trigger avoids re-coordinating the
      two schedules every time?
    options:
      A: A table update trigger on the silver table.
      B: A cron schedule offset to run shortly after the upstream job usually finishes.
      C: Merging both jobs into one so the dependency is a task dependency.
      D: A file arrival trigger on the silver table's storage location.
    correct: A
    explanation: >-
      A table update trigger reacts to the data actually changing, so the downstream job
      no longer cares when the upstream one runs. That decoupling is the point: the
      schedules can drift independently and the dependency still holds.
    distractor_rationale:
      B: >-
        This is the coupling the requirement asks you to remove - every upstream schedule
        change means re-tuning the offset.
      C: >-
        Valid when both are owned by one team, but it forces a single schedule and
        couples their failure domains.
      D: >-
        Delta writes produce many file operations including compaction, so file arrival
        is a noisy and unreliable proxy for "the table was updated". For a managed table
        it is not even allowed: a file arrival trigger cannot watch a path inside a
        managed catalog or schema location.
    near_misses:
      - text: A table update trigger on the gold table.
        why: >-
          The gold table is this job's own output. Watching it starts a run after each of the
          job's own writes, and a silver update alone never starts one.
      - text: A continuous trigger watching the gold table.
        why: >-
          A continuous job watches no table: it starts a new run as soon as the last one
          ends. And the gold table is this job's own output, not the upstream data.
      - text: A continuous trigger watching the silver table.
        why: >-
          A continuous trigger takes no table. It starts a new run whenever the previous one
          ends, so the job runs all day whether silver changed or not.

  - id: ASSOC-S4-Q009
    objective_ids: [ASSOC-S4-O3]
    difficulty: recall
    provenance: original
    tags: [scheduling, cron, concurrency]
    stem: >-
      A newly created job is scheduled hourly but sometimes takes longer than an hour. By
      default, what happens at the next scheduled time?
    options:
      A: The scheduled run is skipped while the previous run is still active.
      B: A second run starts concurrently with the first.
      C: The running job is cancelled and restarted.
      D: The run is queued and starts as soon as the previous one finishes.
    correct: D
    explanation: >-
      Max concurrent runs defaults to 1, and queueing is on by default for new jobs, so
      an overlapping scheduled run waits in the queue (for up to 48 hours) and starts
      when the active run ends. That keeps two runs from writing the same table at once
      without losing a run, but a job that consistently overruns builds a backlog of
      queued runs rather than catching up. Skipping is what happens when queueing is
      turned off - and what older study material describes as the default.
    distractor_rationale:
      A: >-
        That is the behaviour with queueing turned off: the run ends at once as skipped,
        with MAX_CONCURRENT_RUNS_EXCEEDED. New jobs have queueing on.
      B: Only if max concurrent runs is deliberately raised above 1.
      C: Databricks never cancels a running job to start a scheduled one.
    near_misses:
      - text: The run is queued and starts at the next hourly slot after the previous one finishes.
        why: >-
          A queued run starts as soon as the job is back under its concurrency limit. It
          does not wait for another schedule tick.
      - text: The run is skipped, and the job runs again at the next hourly slot after the previous one finishes.
        why: >-
          That is the behaviour only with queueing turned off. With the defaults, a run
          started while another was active came back QUEUED, not skipped.
      - text: The run is skipped, and retried as soon as the previous one finishes.
        why: >-
          With queueing on the run is queued, not skipped. With it off, a skipped run is
          final: it ends as skipped with MAX_CONCURRENT_RUNS_EXCEEDED and nothing retries it.

  - id: ASSOC-S4-Q012
    objective_ids: [ASSOC-S4-O4]
    difficulty: analysis
    provenance: original
    tags: [table-update-trigger, dependencies, data-driven]
    stem: >-
      A job builds gold.daily_sales by joining silver.orders and silver.customers. Two
      other teams refresh those tables once a day each, at times that vary. The job must
      run once per day, only after both silver tables have been refreshed, and never on
      one table's new data alone. Which trigger meets this?
    options:
      A: A table update trigger on silver.orders and silver.customers with the condition ALL_UPDATED.
      B: A file arrival trigger on the storage locations of silver.orders and silver.customers.
      C: A scheduled run at 23:00, after both refreshes have usually finished.
      D: Two jobs, each with a table update trigger on one silver table, that both run the same notebook.
    correct: A
    explanation: >-
      The requirement is a dependency on two pieces of data, not on a clock, so it calls
      for a data-driven trigger. A table update trigger watches up to ten tables, and its
      condition decides when the set counts as updated: ALL_UPDATED starts a run only once
      every watched table has changed since the last run, ANY_UPDATED as soon as one has.
      Waiting for all of them is what keeps the join from reading today's orders against
      yesterday's customers, and it needs no knowledge of when either team runs.
    distractor_rationale:
      B: >-
        A file arrival trigger watches one volume or external location path and has no
        "both" condition, so a new file in either location starts a run. It also cannot
        watch a managed table's storage, and Delta maintenance writes files too.
      C: >-
        A fixed time guesses at the upstream schedules. On a day either refresh runs late,
        the job reads stale data, and on most days it waits longer than it needs to.
      D: >-
        Each job fires on its own table alone, which is exactly what the requirement
        forbids, and the notebook runs twice a day.
    near_misses:
      - text: A table update trigger on silver.orders, silver.customers and gold.daily_sales with the condition ALL_UPDATED.
        why: >-
          gold.daily_sales changes only when this job writes it, so the condition "all
          three updated" is never met and the job never starts.
      - text: A table update trigger on silver.orders, silver.customers and gold.daily_sales with the condition ANY_UPDATED.
        why: >-
          The gold table is this job's own output. Each run's write counts as an update,
          so after every silver refresh the job runs again on its own write.
      - text: A table update trigger on silver.orders and silver.customers with the condition ANY_UPDATED.
        why: >-
          ANY_UPDATED starts a run as soon as either table changes, so the job runs twice a
          day and the first run joins one fresh table with one stale one.
